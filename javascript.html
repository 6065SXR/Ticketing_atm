<script>
  /* ========================================================
   * GLOBAL VARIABLES & SESSION CONSTANTS
   * ======================================================== */
  var currentSection = 'Dashboard';
  var currentPage = 1;
  var pageSize = 10;
  var totalPages = 1;
  var totalItems = 0;
  var searchDebounceTimer = null;
  var isSidebarCollapsed = false;

  var currentUser = null;
  var currentFSETab = 'dashboard';

  var cachedDropdowns = {
    banks: [],
    machines: [],
    engineers: []
  };

  var currentTicketsList = [];
  var currentPMList = [];
  var currentFSEList = [];
  var activeActionTicketId = null;
  var activeReceiveTicketId = null;

  // Konstanta Inactivity 2 Jam = 2 * 60 * 60 * 1000 ms
  var TWO_HOURS_MS = 2 * 60 * 60 * 1000;
  var SESSION_STORAGE_KEY = 'ATM_TICKET_ACTIVE_USER';
  var LAST_ACTIVITY_KEY = 'ATM_TICKET_LAST_ACTIVITY_TS';

  window.onload = function() {
    startLiveClock();
    initSessionAndInactivityTracker();
  };

  function startLiveClock() {
    setInterval(function() {
      var now = new Date();
      var h = ('0' + now.getHours()).slice(-2);
      var m = ('0' + now.getMinutes()).slice(-2);
      var s = ('0' + now.getSeconds()).slice(-2);
      var clockDesktop = document.getElementById('live-clock');
      var clockFSE = document.getElementById('fse-live-clock');
      if (clockDesktop) clockDesktop.innerText = h + ':' + m + ':' + s + ' WIB';
      if (clockFSE) clockFSE.innerText = h + ':' + m + ' WIB';
    }, 1000);
  }

  function initSessionAndInactivityTracker() {
    // 1. Cek sesi tersimpan saat halaman dibuka / direfresh
    try {
      var savedUserJson = localStorage.getItem(SESSION_STORAGE_KEY);
      var lastActivityTs = localStorage.getItem(LAST_ACTIVITY_KEY);

      if (savedUserJson && lastActivityTs) {
        var elapsed = Date.now() - parseInt(lastActivityTs, 10);
        if (elapsed < TWO_HOURS_MS) {
          // Masih dalam batas 2 jam: pulihkan sesi langsung tanpa minta login lagi
          var parsedUser = JSON.parse(savedUserJson);
          updateLastActivity();
          executeLogin(parsedUser, true);
        } else {
          // Lewat 2 jam: bersihkan sesi
          clearSessionData();
          showToast('Sesi Berakhir', 'Akun otomatis logout karena tidak ada aktivitas selama 2 jam.', 'error');
        }
      }
    } catch (e) {
      console.error('Session restore error:', e);
    }

    // 2. Pasang event listener untuk semua interaksi (action) pengguna
    var activityEvents = ['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll', 'click'];
    var throttleTimer = null;

    activityEvents.forEach(function(evt) {
      window.addEventListener(evt, function() {
        if (!throttleTimer && currentUser) {
          throttleTimer = setTimeout(function() {
            updateLastActivity();
            throttleTimer = null;
          }, 5000); // Throttle update ke localStorage setiap 5 detik
        }
      }, { passive: true });
    });

    // 3. Pengecekan berkala setiap 30 detik terhadap batas waktu 2 jam
    setInterval(function() {
      if (currentUser) {
        var lastTs = localStorage.getItem(LAST_ACTIVITY_KEY);
        if (lastTs) {
          var diff = Date.now() - parseInt(lastTs, 10);
          if (diff >= TWO_HOURS_MS) {
            handleLogout(true);
          }
        }
      }
    }, 30000);
  }

  function updateLastActivity() {
    localStorage.setItem(LAST_ACTIVITY_KEY, Date.now().toString());
  }

  function clearSessionData() {
    localStorage.removeItem(SESSION_STORAGE_KEY);
    localStorage.removeItem(LAST_ACTIVITY_KEY);
  }

  function togglePasswordVisibility() {
    var passInput = document.getElementById('login-password');
    var eyeIcon = document.getElementById('eye-icon');
    if (!passInput) return;

    if (passInput.type === 'password') {
      passInput.type = 'text';
      if (eyeIcon) eyeIcon.className = 'fa-regular fa-eye-slash absolute right-3.5 top-3 text-teal-600 cursor-pointer';
    } else {
      passInput.type = 'password';
      if (eyeIcon) eyeIcon.className = 'fa-regular fa-eye absolute right-3.5 top-3 text-slate-400 cursor-pointer hover:text-slate-600';
    }
  }

  function quickLoginDemo(role) {
    var demoCredentials = {
      monitoring: { hp: '081200000002', pass: 'monitoring123' },
      fse: { hp: '081299881122', pass: 'fse123' },
      admin: { hp: '081100000001', pass: 'admin123' }
    };

    var target = demoCredentials[role] || demoCredentials.monitoring;
    document.getElementById('login-username').value = target.hp;
    document.getElementById('login-password').value = target.pass;

    handleLoginProcess(target.hp, target.pass);
  }

  function handleLoginSubmit(event) {
    event.preventDefault();
    var inputHp = document.getElementById('login-username').value.trim();
    var inputPass = document.getElementById('login-password').value.trim();

    handleLoginProcess(inputHp, inputPass);
  }

  function handleLoginProcess(hp, pass) {
    var btn = document.getElementById('btn-login-submit');
    var btnText = document.getElementById('btn-login-text');
    if (btn) btn.disabled = true;
    if (btnText) btnText.innerText = 'Memverifikasi Kredensial...';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerText = 'Masuk ke Sistem';

          if (res && res.status === 'success') {
            executeLogin(res.user, false);
          } else {
            showToast('Gagal Masuk', res ? res.message : 'Kredensial tidak cocok', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerText = 'Masuk ke Sistem';
          showToast('Error Server', 'Kendala koneksi backend: ' + err, 'error');
        })
        .authenticateUser(hp, pass);
    } else {
      if (btn) btn.disabled = false;
      if (btnText) btnText.innerText = 'Masuk ke Sistem';

      var fallbackUser = {
        userId: (hp === '081299881122') ? 'USR-003' : 'USR-001',
        name: (hp === '081299881122') ? 'Rizky Hardiansyah' : 'Monitoring Officer',
        noHp: hp,
        roleKey: (hp === '081299881122') ? 'fse' : 'monitoring',
        roleTitle: (hp === '081299881122') ? 'Field Service Engineer' : 'Monitoring Officer',
        initials: (hp === '081299881122') ? 'RH' : 'MO',
        wilayah: 'Jakarta Pusat & Barat',
        indicator: (hp === '081299881122') ? 'FIELD SERVICE OPS' : 'NOC ATM MONITORING'
      };
      executeLogin(fallbackUser, false);
    }
  }

  function executeLogin(userObj, isRestoredSession) {
    currentUser = userObj;

    // Simpan ke localStorage untuk toleransi refresh
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(userObj));
    updateLastActivity();

    document.getElementById('login-view').classList.add('hidden');

    if (userObj.roleKey === 'fse') {
      // Role FSE -> Buka antarmuka mobile khusus
      document.getElementById('app-viewport').classList.add('hidden');
      document.getElementById('fse-mobile-viewport').classList.remove('hidden');

      document.getElementById('fse-bar-name').innerText = userObj.name;
      document.getElementById('fse-hero-greeting').innerText = 'Halo, ' + userObj.name.split(' ')[0] + '!';
      document.getElementById('fse-hero-wilayah').innerHTML = '<i class="fa-solid fa-location-dot text-emerald-300"></i><span>Area Tugas: ' + escapeHtml(userObj.wilayah || 'Jabodetabek') + '</span>';

      switchFSETab('dashboard');
      loadFSEPortalData();
    } else {
      // Role Monitoring & Admin -> Buka Dashboard Desktop / Tablet
      document.getElementById('fse-mobile-viewport').classList.add('hidden');
      document.getElementById('app-viewport').classList.remove('hidden');

      document.getElementById('user-profile-name').innerText = userObj.name;
      document.getElementById('user-profile-role').innerText = userObj.roleTitle;
      document.getElementById('user-avatar-badge').innerText = userObj.initials;
      document.getElementById('sidebar-role-indicator').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span><span class="truncate">' + escapeHtml(userObj.indicator) + '</span>';

      applyRolePermissions(userObj);

      loadDropdowns();
      fetchTickets(1);
      loadDashboardMetrics();
      loadSectionAuxiliaryData('FSE');
      loadSectionAuxiliaryData('DataPM');
      loadSectionAuxiliaryData('DatabaseMesin');
      loadSectionAuxiliaryData('DatabaseCustomer');
      renderKPIScorecards();
    }

    if (!isRestoredSession) {
      showToast('Login Berhasil', 'Selamat datang, ' + userObj.name + ' (' + userObj.roleTitle + ')', 'success');
    }
  }

  function applyRolePermissions(userObj) {
    var isMonitoring = (userObj && (userObj.roleKey === 'monitoring' || userObj.roleKey === 'admin'));
    var fseBtnContainer = document.getElementById('container-monitoring-fse-action');
    var thFseAction = document.getElementById('th-fse-action');

    if (fseBtnContainer) {
      if (isMonitoring) fseBtnContainer.classList.remove('hidden');
      else fseBtnContainer.classList.add('hidden');
    }

    if (thFseAction) {
      thFseAction.style.display = isMonitoring ? '' : 'none';
    }
  }

  function handleLogout(isAutoLogout) {
    clearSessionData();
    currentUser = null;

    document.getElementById('app-viewport').classList.add('hidden');
    document.getElementById('fse-mobile-viewport').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');

    if (isAutoLogout) {
      showToast('Sesi Berakhir', 'Akun otomatis logout karena tidak ada aktivitas selama 2 jam.', 'error');
    } else {
      showToast('Sesi Berakhir', 'Anda telah keluar dari aplikasi.', 'success');
    }
  }

  /* ========================================================
   * FSE MOBILE PORTAL: CONTROLLER, TABS & TELEMETRY
   * ======================================================== */

  function switchFSETab(tabId) {
    currentFSETab = tabId;

    var subviews = document.querySelectorAll('.fse-subview');
    for (var i = 0; i < subviews.length; i++) {
      subviews[i].classList.add('hidden');
    }

    var targetView = document.getElementById('fse-view-' + tabId);
    if (targetView) targetView.classList.remove('hidden');

    var buttons = document.querySelectorAll('.fse-bottom-btn');
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].classList.remove('active', 'text-teal-700', 'font-semibold');
      buttons[j].classList.add('text-slate-400', 'font-medium');
    }

    var targetBtn = document.getElementById('fse-nav-' + tabId);
    if (targetBtn) {
      targetBtn.classList.remove('text-slate-400', 'font-medium');
      targetBtn.classList.add('active', 'text-teal-700', 'font-semibold');
    }
  }

  function loadFSEPortalData() {
    if (!currentUser || currentUser.roleKey !== 'fse') return;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            renderFSEPortalDOM(res.data);
          }
        })
        .withFailureHandler(function(err) {
          console.error('Error loadFSEPortalData:', err);
        })
        .getFSEPersonalSummary(currentUser.name, currentUser.userId);
    } else {
      // Local fallback simulator
      var mockSummary = {
        wilayah: currentUser.wilayah || 'Jakarta Pusat & Barat',
        jumlahMesin: 8,
        totalCM: 2,
        totalPM: '1/1 (100%)',
        assignedTickets: [
          { idTiket: '260910-0001', bank: 'Bank Central Asia (BCA)', serialNumber: 'SN-BCA-99201', idMesin: 'ATM-BCA-01', tanggalTiket: '2026-09-10', jamTiket: '08:15:20', tipeTiket: 'CM', problem: 'Mesin Card Reader error code 42', statusTiket: 'Handling', note: '' },
          { idTiket: '260910-0004', bank: 'Bank CIMB Niaga', serialNumber: 'SN-CIMB-3341', idMesin: 'ATM-CIMB-01', tanggalTiket: '2026-09-10', jamTiket: '13:00:10', tipeTiket: 'CM', problem: 'Cash Jammed dispenser', statusTiket: 'Respon', note: '' }
        ],
        closedDocuments: [
          { idTiket: '260908-0012', bank: 'Bank Mandiri', serialNumber: 'SN-MDR-44011', idMesin: 'ATM-MDR-01', closedAt: '2026-09-08 16:30:00', hardcopyStatus: 'Belum Dikirim' }
        ]
      };
      renderFSEPortalDOM(mockSummary);
    }
  }

  function renderFSEPortalDOM(data) {
    if (!data) return;

    // 1. Dashboard Metrics
    document.getElementById('fse-stat-mesin').innerText = (data.jumlahMesin || 0);
    document.getElementById('fse-stat-cm').innerText = (data.totalCM || 0);
    document.getElementById('fse-stat-pm').innerText = (data.totalPM || 0);

    // 2. Render Assigned Tickets
    renderFSETicketsList(data.assignedTickets || []);

    // 3. Render Closed Documents (Tab Kirim Dokumen)
    renderFSEClosedDocuments(data.closedDocuments || [], data.wilayah || 'Jabodetabek');
  }

  function renderFSETicketsList(tickets) {
    var container = document.getElementById('fse-ticket-cards-container');
    var badge = document.getElementById('fse-ticket-count-badge');
    if (!container) return;

    if (!tickets || tickets.length === 0) {
      container.innerHTML = '<div class="soft-card-panel p-6 text-center text-slate-400 text-xs rounded-2xl"><i class="fa-solid fa-clipboard-check text-2xl text-teal-600 mb-2 block"></i>Tidak ada antrean tiket aktif saat ini. Kerja bagus!</div>';
      if (badge) badge.classList.add('hidden');
      return;
    }

    if (badge) badge.classList.remove('hidden');

    var html = '';
    for (var i = 0; i < tickets.length; i++) {
      var t = tickets[i];
      var st = String(t.statusTiket || 'Open').trim();
      var stLower = st.toLowerCase();

      html += '<div class="soft-card-panel p-3.5 rounded-2xl space-y-2.5 border border-slate-200/90 shadow-sm bg-white/80">';
      
      // Header Card
      html += '<div class="flex items-center justify-between">';
      html += '<span class="font-mono font-bold text-teal-700 text-xs">' + escapeHtml(t.idTiket) + '</span>';
      html += getStatusBadgeHtml(st);
      html += '</div>';

      // Machine & Bank info
      html += '<div>';
      html += '<div class="font-bold text-xs text-slate-800">' + escapeHtml(t.bank) + '</div>';
      html += '<div class="text-[11px] font-mono text-slate-500">' + escapeHtml(t.serialNumber) + ' &bull; ' + escapeHtml(t.idMesin) + '</div>';
      html += '</div>';

      // Problem description
      html += '<div class="p-2 rounded-xl bg-slate-50 border border-slate-100 text-[11px] text-slate-700">';
      html += '<span class="font-semibold text-slate-900 block mb-0.5">Problem:</span>';
      html += escapeHtml(t.problem);
      if (t.note) {
        html += '<div class="mt-1 text-[10px] text-slate-500 italic border-t border-slate-200/50 pt-1">' + escapeHtml(t.note) + '</div>';
      }
      html += '</div>';

      // Waktu buat
      html += '<div class="flex items-center justify-between text-[10px] text-slate-400 font-mono">';
      html += '<span><i class="fa-regular fa-clock mr-1"></i>' + escapeHtml(t.tanggalTiket) + ' ' + escapeHtml(t.jamTiket) + '</span>';
      html += '<span class="uppercase font-semibold text-teal-700">' + escapeHtml(t.tipeTiket) + '</span>';
      html += '</div>';

      // STRICT FSE ACTION BUTTONS ENGINE
      html += '<div class="pt-2 border-t border-slate-100 flex flex-wrap gap-1.5">';

      if (stLower === 'open' || stLower === 'baru') {
        html += '<button onclick="executeFSEAction(\'' + escapeHtml(t.idTiket) + '\', \'Respon\')" class="flex-1 soft-btn-primary py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1"><i class="fa-solid fa-check"></i> Respon Tiket</button>';
      } else if (stLower === 'respon') {
        html += '<button onclick="executeFSEAction(\'' + escapeHtml(t.idTiket) + '\', \'Appointment\')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-xs font-semibold shadow-sm flex items-center justify-center gap-1"><i class="fa-solid fa-calendar-check"></i> Konfirmasi Appointment</button>';
      } else if (stLower === 'appointment') {
        html += '<button onclick="executeFSEAction(\'' + escapeHtml(t.idTiket) + '\', \'Handling\')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-semibold shadow-sm flex items-center justify-center gap-1"><i class="fa-solid fa-wrench"></i> Mulai Handling di Lokasi</button>';
      } else if (stLower === 'handling' || stLower === 'take a part') {
        html += '<button onclick="openReAppointmentModal(\'' + escapeHtml(t.idTiket) + '\')" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-[11px] font-semibold flex items-center gap-1"><i class="fa-solid fa-arrows-rotate"></i> Re-Appointment</button>';
        if (stLower !== 'take a part') {
          html += '<button onclick="executeFSEAction(\'' + escapeHtml(t.idTiket) + '\', \'Take a Part\')" class="px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-[11px] font-medium"><i class="fa-solid fa-box-open mr-1"></i>Take Part</button>';
        }
        html += '<button onclick="executeFSEAction(\'' + escapeHtml(t.idTiket) + '\', \'Solving\')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-semibold shadow-sm flex items-center justify-center gap-1"><i class="fa-solid fa-circle-check"></i> Solving / Selesai</button>';
      } else if (stLower === 'solving' || stLower === 'solved') {
        html += '<div class="w-full text-center py-1.5 px-2 bg-emerald-50 text-emerald-800 rounded-xl text-[11px] font-medium border border-emerald-200"><i class="fa-solid fa-lock mr-1"></i> Tiket Solved (Menunggu Closed Monitoring)</div>';
      } else if (stLower === 'cancel') {
        html += '<div class="w-full text-center py-1.5 px-2 bg-rose-50 text-rose-700 rounded-xl text-[11px] font-medium border border-rose-200"><i class="fa-solid fa-ban mr-1"></i> Tiket Dibatalkan (Hanya Monitoring yang berhak ubah)</div>';
      }

      html += '</div>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderFSEClosedDocuments(documents, wilayahFSE) {
    var container = document.getElementById('fse-document-cards-container');
    var docAlert = document.getElementById('fse-doc-alert-badge');
    if (!container) return;

    if (!documents || documents.length === 0) {
      container.innerHTML = '<div class="soft-card-panel p-6 text-center text-slate-400 text-xs rounded-2xl"><i class="fa-solid fa-file-circle-check text-2xl text-teal-600 mb-2 block"></i>Tidak ada berkas hardcopy yang perlu dikirim saat ini.</div>';
      if (docAlert) docAlert.classList.add('hidden');
      return;
    }

    // Deteksi wilayah Jabodetabek (3 Hari) vs Luar Jabodetabek (7 Hari)
    var wLower = String(wilayahFSE || '').toLowerCase();
    var isJabodetabek = (
      wLower.indexOf('jakarta') !== -1 ||
      wLower.indexOf('jabodetabek') !== -1 ||
      wLower.indexOf('bogor') !== -1 ||
      wLower.indexOf('depok') !== -1 ||
      wLower.indexOf('tangerang') !== -1 ||
      wLower.indexOf('bekasi') !== -1
    );

    var maxDays = isJabodetabek ? 3 : 7;
    var html = '';
    var hasPendingDoc = false;

    for (var i = 0; i < documents.length; i++) {
      var doc = documents[i];
      var isReceived = (String(doc.hardcopyStatus).toLowerCase() === 'diterima');

      var closedDate = doc.closedAt ? new Date(doc.closedAt.replace(/-/g, '/')) : new Date();
      var deadlineDate = new Date(closedDate.getTime() + (maxDays * 24 * 60 * 60 * 1000));
      var now = new Date();
      var diffMs = deadlineDate.getTime() - now.getTime();
      var diffHours = Math.round(diffMs / (1000 * 60 * 60));
      var diffDays = Math.ceil(diffHours / 24);

      var slaBadge = '';
      if (isReceived) {
        slaBadge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold"><i class="fa-solid fa-check-double mr-1"></i>File Diterima Admin</span>';
      } else if (diffHours < 0) {
        hasPendingDoc = true;
        slaBadge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] bg-rose-50 border border-rose-200 text-rose-700 font-bold animate-pulse"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Overdue (' + Math.abs(diffDays) + ' Hari)</span>';
      } else if (diffDays <= 1) {
        hasPendingDoc = true;
        slaBadge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] bg-amber-50 border border-amber-200 text-amber-700 font-bold"><i class="fa-solid fa-clock mr-1"></i>Batas Hari Ini (' + diffHours + ' Jam)</span>';
      } else {
        hasPendingDoc = true;
        slaBadge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] bg-sky-50 border border-sky-200 text-sky-700 font-semibold">Sisa ' + diffDays + ' Hari</span>';
      }

      html += '<div class="soft-card-panel p-3.5 rounded-2xl space-y-2 border border-slate-200/90 shadow-sm bg-white/80">';
      html += '<div class="flex items-center justify-between">';
      html += '<span class="font-mono font-bold text-teal-700 text-xs">' + escapeHtml(doc.idTiket) + '</span>';
      html += slaBadge;
      html += '</div>';

      html += '<div>';
      html += '<div class="font-bold text-xs text-slate-800">' + escapeHtml(doc.bank) + '</div>';
      html += '<div class="text-[11px] font-mono text-slate-500">' + escapeHtml(doc.serialNumber) + ' (' + escapeHtml(doc.idMesin) + ')</div>';
      html += '</div>';

      html += '<div class="p-2 rounded-xl bg-slate-50 border border-slate-100 text-[10px] text-slate-600 flex justify-between">';
      html += '<span>Closed: ' + escapeHtml(doc.closedAt || '-') + '</span>';
      html += '<span class="font-semibold text-slate-700">Target Hardcopy: ' + maxDays + ' Hari</span>';
      html += '</div>';

      if (isReceived) {
        html += '<div class="text-[10px] text-emerald-700 bg-emerald-50/70 p-2 rounded-xl border border-emerald-200">';
        html += '<i class="fa-solid fa-circle-check mr-1"></i> Berkas telah diverifikasi oleh <b>' + escapeHtml(doc.hardcopyReceivedBy || 'Admin') + '</b>';
        html += '</div>';
      } else {
        html += '<div class="text-[10px] text-slate-500 italic">';
        html += 'Kirim dokumen fisik (BAST/Service Sheet) ke Kantor Ops Admin.';
        html += '</div>';
      }

      html += '</div>';
    }

    if (docAlert) {
      if (hasPendingDoc) docAlert.classList.remove('hidden');
      else docAlert.classList.add('hidden');
    }

    container.innerHTML = html;
  }

  function executeFSEAction(ticketId, targetStatus) {
    if (!currentUser) return;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            showToast('Status Diperbarui', 'Tiket ' + ticketId + ' diubah ke: ' + targetStatus, 'success');
            loadFSEPortalData();
          } else {
            showToast('Aksi Ditolak', res ? res.message : 'Gagal memperbarui status', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Error Server', 'Gagal memproses aksi: ' + err, 'error');
        })
        .updateTicketStatus(ticketId, targetStatus, '', currentUser);
    } else {
      showToast('Status Diperbarui (Simulasi)', 'Tiket ' + ticketId + ' -> ' + targetStatus, 'success');
      loadFSEPortalData();
    }
  }

      html += '</td>';

      html += '<div class="font-medium text-slate-800 truncate" title="' + escapeHtml(t.problem) + '">' + escapeHtml(t.problem) + '</div>';
      if (t.note) {
        html += '<div class="text-[10px] text-slate-500 italic truncate" title="' + escapeHtml(t.note) + '">' + escapeHtml(t.note) + '</div>';
      }
      html += '</td>';
      html += '<td class="p-3 whitespace-nowrap">' + badge + '</td>';

      html += '<td class="p-3 text-center whitespace-nowrap">';

      html += '<button onclick="openStatusModal(\'' + escapeHtml(t.idTiket) + '\', \'' + escapeHtml(t.statusTiket) + '\')" class="px-2.5 py-1 text-[11px] rounded-lg bg-teal-50 border border-teal-200 text-teal-700 hover:bg-teal-600 hover:text-white transition font-medium shadow-sm">';

  function getStatusBadgeHtml(status) {
    var s = String(status || '').trim();
    var colorClass = 'bg-slate-100 text-slate-700 border-slate-200';

    if (s === 'Open' || s === 'Baru') colorClass = 'bg-amber-50 text-amber-700 border-amber-200';
    else if (s === 'Respon') colorClass = 'bg-sky-50 text-sky-700 border-sky-200';
    else if (s === 'Appointment' || s === 'Re-Appointment') colorClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
    else if (s === 'Handling' || s === 'Proses') colorClass = 'bg-blue-50 text-blue-700 border-blue-200';
    else if (s === 'Solving' || s === 'Selesai') colorClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
    else if (s === 'Closed') colorClass = 'bg-purple-50 text-purple-700 border-purple-300 font-bold';
    else if (s === 'Take a Part') colorClass = 'bg-orange-50 text-orange-700 border-orange-200';
    else if (s === 'Cancel' || s === 'Batal') colorClass = 'bg-rose-50 text-rose-700 border-rose-200';

    return '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ' + colorClass + '">' + escapeHtml(s) + '</span>';
  }

  function updateDistributionBars(total, solved, handling, open) {
    if (total <= 0) total = 1;
    var pSolved = Math.round((solved / total) * 100);
    var pHandling = Math.round((handling / total) * 100);
    var pOpen = Math.round((open / total) * 100);

    var distS = document.getElementById('dist-solving');
    var barS = document.getElementById('dist-bar-solving');
    var distH = document.getElementById('dist-handling');
    var barH = document.getElementById('dist-bar-handling');
    var distO = document.getElementById('dist-open');
    var barO = document.getElementById('dist-bar-open');

    if (distS) distS.innerText = pSolved + '%';
    if (barS) barS.style.width = pSolved + '%';
    if (distH) distH.innerText = pHandling + '%';
    if (barH) barH.style.width = pHandling + '%';
    if (distO) distO.innerText = pOpen + '%';
    if (barO) barO.style.width = pOpen + '%';
  }

      tanggalTiket: String(document.getElementById('input-ticket-date').value).trim(),
      jamTiket: String(document.getElementById('input-ticket-time').value).trim(),
      tipeTiket: String(document.getElementById('input-ticket-type').value).trim(),
      namaEngineer: String(document.getElementById('input-engineer').value).trim(),
      problem: String(document.getElementById('input-problem').value).trim(),
      note: String(document.getElementById('input-note').value).trim(),
      statusTiket: 'Open'
    };

    closeCreateTicketModal();
    showToast('Tiket Diterbitkan', 'Tiket ' + payload.idTiket + ' berhasil dibuat!', 'success');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            fetchTickets(1);
            loadDashboardMetrics();
          }
        })
        .createTicket(payload);
    }
  }

  function loadSectionAuxiliaryData(section) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            if (section === 'FSE') {
              currentFSEList = res.data || [];
              renderFSETable(currentFSEList);
            }
            if (section === 'DataPM') {
              currentPMList = res.data || [];
              renderPMTable(currentPMList);
            }
            if (section === 'DatabaseMesin') renderMachinesTable(res.data);
            if (section === 'DatabaseCustomer') renderCustomersTable(res.data);
            if (section === 'ReportingFSE') renderReportingCards(res.data);
          }
        })
        .getSectionData(section);
    }
  }

  function renderFSETable(list) {
    var tbody = document.getElementById('fse-table-body');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-400 font-mono text-xs"><i class="fa-solid fa-users-slash text-2xl mb-2 block text-slate-300"></i>Tidak ada data FSE</td></tr>';
      return;
    }

    var isMonitoring = (currentUser && (currentUser.roleKey === 'monitoring' || currentUser.roleKey === 'admin'));
    var html = '';

    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var isAktif = (String(item.status || 'Aktif').toLowerCase() === 'aktif');
      var statusBadge = isAktif
        ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200">Aktif</span>'
        : '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border bg-rose-50 text-rose-700 border-rose-200">Nonaktif</span>';

      html += '<tr class="hover:bg-white/80 transition">';
      html += '<td class="p-3 font-mono font-bold text-teal-700 whitespace-nowrap">' + escapeHtml(item.userId || ('USR-00' + (i + 1))) + '</td>';
      html += '<td class="p-3">';
      html += '<div class="font-semibold text-slate-800">' + escapeHtml(item.nama) + '</div>';
      html += '<div class="text-[10px] text-slate-400 font-mono"><i class="fa-solid fa-phone mr-1"></i>' + escapeHtml(item.noHp || '-') + '</div>';
      html += '</td>';
      html += '<td class="p-3 text-slate-700 whitespace-nowrap">' + escapeHtml(item.wilayah || '-') + '</td>';
      html += '<td class="p-3 text-center whitespace-nowrap"><span class="px-2.5 py-1 rounded-lg bg-teal-50 border border-teal-200 font-mono font-bold text-teal-800">' + (item.jumlahMesin || 0) + ' Mesin</span></td>';
      html += '<td class="p-3 text-center whitespace-nowrap"><span class="px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 font-mono font-bold text-slate-700">' + (item.totalCM || 0) + ' Tiket</span></td>';
      html += '<td class="p-3 text-center whitespace-nowrap"><span class="px-2.5 py-1 rounded-lg bg-emerald-50 border border-emerald-200 font-mono font-bold text-emerald-700">' + escapeHtml(item.pmAchievement || '0 / 0 (100%)') + '</span></td>';
      html += '<td class="p-3 text-center whitespace-nowrap">' + statusBadge + '</td>';
      
      if (isMonitoring) {
        html += '<td class="p-3 text-center whitespace-nowrap">';
        html += '<div class="flex items-center justify-center gap-1.5">';
        html += '<button onclick="openEditFSEModal(\'' + escapeHtml(item.userId) + '\')" title="Edit Data FSE" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-teal-700 hover:bg-teal-50 transition shadow-sm font-medium text-[11px]">';
        html += '<i class="fa-solid fa-pen-to-square text-[10px]"></i> Edit';
        html += '</button>';
        html += '<button onclick="handleToggleFSEStatus(\'' + escapeHtml(item.userId) + '\', \'' + escapeHtml(item.status || 'Aktif') + '\')" class="px-2 py-1 rounded-lg border text-[11px] transition shadow-sm font-medium ' + (isAktif ? 'bg-white border-slate-200 text-slate-500 hover:text-rose-600' : 'bg-emerald-50 border-emerald-200 text-emerald-700') + '">';
        html += isAktif ? '<i class="fa-solid fa-power-off"></i>' : '<i class="fa-solid fa-check"></i>';
        html += '</button>';
        html += '</div>';
        html += '</td>';
      } else {
        html += '<td class="p-3 text-center text-slate-400 text-[11px] italic">-</td>';
      }

      html += '</tr>';
    }

    tbody.innerHTML = html;
  }

  function handleFSESearchInput() {
    var searchInput = document.getElementById('filter-fse-search');
    var clearBtn = document.getElementById('btn-clear-fse-search');
    var query = searchInput ? searchInput.value.trim() : '';

    if (clearBtn) {
      if (query.length > 0) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
    }

    var q = query.toLowerCase();
    var filtered = currentFSEList.filter(function(item) {
      return (
        String(item.userId || '').toLowerCase().indexOf(q) !== -1 ||
        String(item.nama || '').toLowerCase().indexOf(q) !== -1 ||
        String(item.wilayah || '').toLowerCase().indexOf(q) !== -1 ||
        String(item.noHp || '').toLowerCase().indexOf(q) !== -1
      );
    });

    renderFSETable(filtered);
  }

  function clearFSESearch() {
    var searchInput = document.getElementById('filter-fse-search');
    var clearBtn = document.getElementById('btn-clear-fse-search');
    if (searchInput) searchInput.value = '';
    if (clearBtn) clearBtn.classList.add('hidden');
    renderFSETable(currentFSEList);
  }

  function openCreateFSEModal() {
    document.getElementById('form-new-fse').reset();
    document.getElementById('modal-create-fse').classList.remove('hidden');
  }

  function closeCreateFSEModal() {
    document.getElementById('modal-create-fse').classList.add('hidden');
  }

  function handleCreateFSESubmit(event) {
    event.preventDefault();
    var payload = {
      nama: String(document.getElementById('input-fse-nama').value).trim(),
      noHp: String(document.getElementById('input-fse-hp').value).trim(),
      password: String(document.getElementById('input-fse-password').value).trim(),
      wilayah: String(document.getElementById('input-fse-wilayah').value).trim(),
      kelolaanMesin: parseInt(document.getElementById('input-fse-mesin').value, 10) || 0
    };

    closeCreateFSEModal();
    showToast('FSE Didaftarkan', 'Akun FSE ' + payload.nama + ' berhasil dibuat!', 'success');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            loadSectionAuxiliaryData('FSE');
            loadDropdowns();
          }
        })
        .registerFSE(payload, currentUser);
    }
  }

  function openEditFSEModal(userId) {
    var target = currentFSEList.find(function(x) { return x.userId === userId; });
    if (!target) return;

    document.getElementById('edit-fse-userid').value = target.userId;
    document.getElementById('edit-fse-nama').value = target.nama;
    document.getElementById('edit-fse-hp').value = target.noHp;
    document.getElementById('edit-fse-password').value = '';
    document.getElementById('edit-fse-wilayah').value = target.wilayah;
    document.getElementById('edit-fse-mesin').value = target.jumlahMesin || 0;
    document.getElementById('edit-fse-status').value = target.status || 'Aktif';

    document.getElementById('modal-edit-fse').classList.remove('hidden');
  }

  function closeEditFSEModal() {
    document.getElementById('modal-edit-fse').classList.add('hidden');
  }

  function handleEditFSESubmit(event) {
    event.preventDefault();
    var payload = {
      userId: document.getElementById('edit-fse-userid').value.trim(),
      nama: document.getElementById('edit-fse-nama').value.trim(),
      noHp: document.getElementById('edit-fse-hp').value.trim(),
      password: document.getElementById('edit-fse-password').value.trim(),
      wilayah: document.getElementById('edit-fse-wilayah').value.trim(),
      kelolaanMesin: parseInt(document.getElementById('edit-fse-mesin').value, 10) || 0,
      status: document.getElementById('edit-fse-status').value
    };

    closeEditFSEModal();
    showToast('Data Diperbarui', 'Data FSE ' + payload.nama + ' berhasil diperbarui.', 'success');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            loadSectionAuxiliaryData('FSE');
            loadDropdowns();
          }
        })
        .updateFSE(payload, currentUser);
    }
  }

  function handleToggleFSEStatus(userId, currentStatus) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            loadSectionAuxiliaryData('FSE');
            showToast('Status Diubah', res.message, 'success');
          }
        })
        .toggleFSEStatus(userId, currentStatus, currentUser);
    }
  }

  function renderPMTable(list) {
    var tbody = document.getElementById('pm-table-body');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-400 font-mono text-xs"><i class="fa-solid fa-calendar-xmark text-2xl mb-2 block text-slate-300"></i>Tidak ada data PM</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      html += '<tr class="hover:bg-white/80 transition">';
      html += '<td class="p-3 font-mono font-bold text-teal-700 whitespace-nowrap">' + escapeHtml(item.idPM) + '</td>';
      html += '<td class="p-3"><div class="font-semibold text-slate-800">' + escapeHtml(item.bank) + '</div><div class="text-[11px] text-slate-500 font-mono">' + escapeHtml(item.serialNumber) + '</div></td>';
      html += '<td class="p-3 text-slate-600 max-w-xs truncate">' + escapeHtml(item.lokasi) + '</td>';
      html += '<td class="p-3 font-mono text-slate-700">' + escapeHtml(item.periode) + '</td>';
      html += '<td class="p-3 font-mono text-slate-600">' + escapeHtml(item.tanggalRencana) + '</td>';
      html += '<td class="p-3 font-mono text-slate-800 font-semibold">' + escapeHtml(item.tanggalRealisasi) + '</td>';
      html += '<td class="p-3"><span class="px-2 py-0.5 rounded-lg bg-slate-100 border border-slate-200 text-slate-700">' + escapeHtml(item.engineer) + '</span></td>';
      html += '<td class="p-3"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200">' + escapeHtml(item.status) + '</span></td>';
      html += '<td class="p-3 text-[11px] text-slate-500 truncate">' + escapeHtml(item.catatan || '-') + '</td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function filterPMTableClientSide() {
    var searchEl = document.getElementById('filter-pm-search');
    var statusEl = document.getElementById('filter-pm-status');
    var s = searchEl ? searchEl.value.toLowerCase().trim() : '';
    var st = statusEl ? statusEl.value.trim() : 'ALL';

    var filtered = currentPMList.filter(function(item) {
      if (st !== 'ALL' && item.status.toLowerCase() !== st.toLowerCase()) return false;
      if (s !== '') {
        var match = (
          item.idPM.toLowerCase().indexOf(s) !== -1 ||
          item.bank.toLowerCase().indexOf(s) !== -1 ||
          item.serialNumber.toLowerCase().indexOf(s) !== -1 ||
          item.lokasi.toLowerCase().indexOf(s) !== -1 ||
          item.engineer.toLowerCase().indexOf(s) !== -1
        );
        if (!match) return false;
      }
      return true;
    });

    renderPMTable(filtered);
  }

  function renderMachinesTable(list) {
    var tbody = document.getElementById('machines-table-body');
    if (!tbody) return;
    if (!list || list.length === 0) return;

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      html += '<tr class="hover:bg-white/80 transition">';
      html += '<td class="p-3 font-mono font-bold text-teal-700">' + escapeHtml(m.idMesin) + '</td>';
      html += '<td class="p-3 font-mono text-slate-800">' + escapeHtml(m.serialNumber) + '</td>';
      html += '<td class="p-3 text-slate-700">' + escapeHtml(m.bank) + '</td>';
      html += '<td class="p-3 text-slate-600">' + escapeHtml(m.lokasi) + '</td>';
      html += '<td class="p-3 text-slate-500">' + escapeHtml(m.tipe) + '</td>';
      html += '<td class="p-3"><span class="px-2.5 py-0.5 rounded-full text-[10px] bg-emerald-50 border border-emerald-200 text-emerald-700 font-semibold">' + escapeHtml(m.status) + '</span></td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function renderCustomersTable(list) {
    var tbody = document.getElementById('customers-table-body');
    if (!tbody) return;
    if (!list || list.length === 0) return;

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      html += '<tr class="hover:bg-white/80 transition">';
      html += '<td class="p-3 font-mono text-amber-700 font-semibold">' + escapeHtml(c.idCustomer) + '</td>';
      html += '<td class="p-3 font-bold text-slate-800">' + escapeHtml(c.namaBank) + '</td>';
      html += '<td class="p-3 text-slate-700">' + escapeHtml(c.kontakPic) + '</td>';
      html += '<td class="p-3 font-mono text-teal-700">' + escapeHtml(c.teleponPic) + '</td>';
      html += '<td class="p-3 text-slate-500 font-mono text-[11px]">' + escapeHtml(c.emailBank) + '</td>';
      html += '<td class="p-3 text-slate-600">' + escapeHtml(c.alamat) + '</td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function renderReportingCards(list) {
    var container = document.getElementById('reporting-cards-container');
    if (!container || !list) return;

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var eng = list[i];
      html += '<div class="soft-card-panel p-4">';
      html += '<div class="flex justify-between items-center mb-3">';
      html += '<span class="font-bold text-sm text-slate-800">' + escapeHtml(eng.nama) + '</span>';
      html += '<span class="text-xs text-teal-700 font-mono font-semibold">' + escapeHtml(eng.completionRate || '100%') + ' Rate</span>';
      html += '</div>';
      html += '<div class="space-y-2 text-xs text-slate-600">';
      html += '<div class="flex justify-between"><span>Tiket Ditugaskan:</span><span class="font-bold text-slate-800">' + (eng.totalAssigned || 0) + ' Tiket</span></div>';
      html += '<div class="flex justify-between"><span>Tiket Selesai (Solving):</span><span class="font-bold text-emerald-600">' + (eng.totalSolving || 0) + ' Tiket</span></div>';
      html += '<div class="flex justify-between"><span>Area Tugas:</span><span class="text-slate-500">' + escapeHtml(eng.wilayah || 'DKI Jakarta') + '</span></div>';
      html += '</div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  function renderKPIScorecards() {
    var container = document.getElementById('kpi-scorecard-container');
    if (!container) return;

    var kpis = [
      { title: 'Ticket Dispatch Speed (Role Monitoring)', target: '< 15 Menit', actual: '8.4 Menit', score: '98.8%' },
      { title: 'FSE MTTR (Mean Time to Repair)', target: '< 4.0 Jam', actual: '2.6 Jam', score: '96.5%' },
      { title: 'ATM First Visit Resolution Rate', target: '> 90.0%', actual: '94.2%', score: '104.6%' },
      { title: 'Data Cleanliness & Timestamp Accuracy', target: '100%', actual: '99.9%', score: '99.9%' }
    ];

    var html = '';
    for (var i = 0; i < kpis.length; i++) {
      var k = kpis[i];
      html += '<div class="soft-card-panel p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">';
      html += '<div>';
      html += '<h4 class="font-semibold text-sm text-slate-800">' + escapeHtml(k.title) + '</h4>';
      html += '<p class="text-slate-500 text-xs mt-0.5">Target: ' + escapeHtml(k.target) + ' | Aktual: <span class="text-slate-800 font-mono font-semibold">' + escapeHtml(k.actual) + '</span></p>';
      html += '</div>';
      html += '<div class="text-right">';
      html += '<span class="text-xl font-bold font-mono text-teal-700">' + escapeHtml(k.score) + '</span>';
      html += '<p class="text-[10px] text-emerald-600 font-medium">Achieved</p>';
      html += '</div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  function showToast(title, message, type) {
    var toast = document.getElementById('toast-notification');
    var icon = document.getElementById('toast-icon');
    var tTitle = document.getElementById('toast-title');
    var tMsg = document.getElementById('toast-message');

    if (!toast) return;

    tTitle.innerText = title;
    tMsg.innerText = message;

    if (type === 'error') {
      icon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-500"></i>';
      toast.style.borderColor = 'rgba(244, 63, 94, 0.4)';
    } else {
      icon.innerHTML = '<i class="fa-solid fa-circle-check text-teal-600"></i>';
      toast.style.borderColor = 'rgba(20, 184, 166, 0.4)';
    }

    toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');

    setTimeout(function() {
      toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
    }, 4000);
  }

  function escapeHtml(string) {
    if (!string) return '';
    return String(string)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
