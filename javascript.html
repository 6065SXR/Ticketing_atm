<script>
  var currentSection = 'Dashboard';
  var currentPage = 1;
  var pageSize = 10;
  var totalPages = 1;
  var totalItems = 0;
  var searchDebounceTimer = null;
  var isSidebarCollapsed = false;

  var currentUser = null;
  var currentFSETab = 'dashboard';
  var activeActionTicketId = null;

  var SESSION_TIMEOUT_MS = 2 * 60 * 60 * 1000;

  var cachedDropdowns = {
    banks: [],
    machines: [],
    engineers: []
  };

  var currentTicketsList = [];
  var currentPMList = [];
  var currentFSEList = [];
  var cachedFSEMachinesList = [];
  var selectedDocumentIds = [];

  window.onload = function() {
    startLiveClock();
    initSessionTracking();
    checkSavedSession();
  };

  function initSessionTracking() {
    var activityEvents = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'];
    for (var i = 0; i < activityEvents.length; i++) {
      document.addEventListener(activityEvents[i], recordUserActivity, { passive: true });
    }

    setInterval(function() {
      if (currentUser) {
        var lastAct = parseInt(localStorage.getItem('atm_last_activity'), 10) || Date.now();
        if (Date.now() - lastAct > SESSION_TIMEOUT_MS) {
          handleAutoLogout();
        }
      }
    }, 15000);
  }

  function recordUserActivity() {
    if (currentUser) {
      localStorage.setItem('atm_last_activity', Date.now().toString());
    }
  }

  function checkSavedSession() {
    try {
      var savedUserJson = localStorage.getItem('atm_user_session');
      var lastAct = parseInt(localStorage.getItem('atm_last_activity'), 10);

      if (savedUserJson && lastAct) {
        if (Date.now() - lastAct < SESSION_TIMEOUT_MS) {
          var userObj = JSON.parse(savedUserJson);
          recordUserActivity();
          executeLogin(userObj, true);
          return;
        } else {
          localStorage.removeItem('atm_user_session');
          localStorage.removeItem('atm_last_activity');
        }
      }
    } catch (e) {
      console.error('Session check error:', e);
    }
  }

  function handleAutoLogout() {
    currentUser = null;
    localStorage.removeItem('atm_user_session');
    localStorage.removeItem('atm_last_activity');
    document.getElementById('app-viewport').classList.add('hidden');
    document.getElementById('fse-mobile-viewport').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
    showToast('Sesi Berakhir', 'Akun otomatis logout karena tidak ada aktivitas selama 2 jam.', 'error');
  }

  function togglePasswordVisibility() {
    var passInput = document.getElementById('login-password');
    var eyeIcon = document.getElementById('eye-icon');
    if (!passInput) return;

    if (passInput.type === 'password') {
      passInput.type = 'text';
      if (eyeIcon) eyeIcon.className = 'fa-regular fa-eye-slash absolute right-3.5 top-3 text-teal-600 cursor-pointer';
    } else {
      passInput.type = 'password';
      if (eyeIcon) eyeIcon.className = 'fa-regular fa-eye absolute right-3.5 top-3 text-slate-400 cursor-pointer hover:text-slate-600';
    }
  }

  function quickLoginDemo(role) {
    var demoCredentials = {
      monitoring: { hp: '081200000002', pass: 'monitoring123' },
      fse: { hp: '081299881122', pass: 'fse123' },
      admin: { hp: '081100000001', pass: 'admin123' }
    };

    var target = demoCredentials[role] || demoCredentials.monitoring;
    document.getElementById('login-username').value = target.hp;
    document.getElementById('login-password').value = target.pass;

    handleLoginProcess(target.hp, target.pass, role);
  }

  function handleLoginSubmit(event) {
    event.preventDefault();
    var inputHp = document.getElementById('login-username').value.trim();
    var inputPass = document.getElementById('login-password').value.trim();

    handleLoginProcess(inputHp, inputPass);
  }

  function handleLoginProcess(hp, pass, intendedRole) {
    var btn = document.getElementById('btn-login-submit');
    var btnText = document.getElementById('btn-login-text');
    if (btn) btn.disabled = true;
    if (btnText) btnText.innerText = 'Memverifikasi Kredensial...';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerText = 'Masuk ke Sistem';

          if (res && res.status === 'success') {
            executeLogin(res.user);
          } else {
            showToast('Gagal Masuk', res ? res.message : 'Kredensial tidak cocok', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerText = 'Masuk ke Sistem';
          showToast('Error Server', 'Kendala backend: ' + err, 'error');
        })
        .authenticateUser(hp, pass);
    } else {
      if (btn) btn.disabled = false;
      if (btnText) btnText.innerText = 'Masuk ke Sistem';

      var cleanHp = String(hp || '').replace(/[^0-9]/g, '');
      var isFSEHp = (
        intendedRole === 'fse' ||
        cleanHp === '081299881122' || 
        cleanHp === '81299881122' ||
        cleanHp === '081377665544' ||
        cleanHp === '081733445566' ||
        String(pass || '').toLowerCase().indexOf('fse') !== -1
      );

      var fallbackUser = {
        userId: isFSEHp ? 'USR-003' : 'USR-001',
        name: isFSEHp ? 'Rizky Hardiansyah' : 'Monitoring Officer',
        noHp: hp,
        roleKey: isFSEHp ? 'fse' : 'monitoring',
        roleTitle: isFSEHp ? 'Field Service Engineer' : 'Monitoring Officer',
        initials: isFSEHp ? 'FS' : 'MO',
        wilayah: 'Jakarta Pusat & Barat',
        indicator: isFSEHp ? 'FIELD SERVICE OPS' : 'NOC ATM MONITORING'
      };
      executeLogin(fallbackUser);
    }
  }

  function executeLogin(userObj, isSessionRestored) {
    if (!userObj) return;

    var rKey = String(userObj.roleKey || userObj.role || '').toLowerCase().trim();
    var rTitle = String(userObj.roleTitle || '').toLowerCase().trim();

    var isFSE = (
      rKey === 'fse' ||
      rKey.indexOf('fse') !== -1 ||
      rKey.indexOf('engineer') !== -1 ||
      rKey.indexOf('teknisi') !== -1 ||
      rKey.indexOf('field') !== -1 ||
      rTitle.indexOf('fse') !== -1 ||
      rTitle.indexOf('engineer') !== -1 ||
      rTitle.indexOf('teknisi') !== -1
    );

    userObj.roleKey = isFSE ? 'fse' : ((rKey.indexOf('admin') !== -1) ? 'admin' : 'monitoring');

    currentUser = userObj;
    localStorage.setItem('atm_user_session', JSON.stringify(userObj));
    localStorage.setItem('atm_last_activity', Date.now().toString());

    document.getElementById('login-view').classList.add('hidden');

    if (isFSE) {
      document.getElementById('app-viewport').classList.add('hidden');
      document.getElementById('fse-mobile-viewport').classList.remove('hidden');

      var fseBarName = document.getElementById('fse-bar-name');
      var fseHeroGreeting = document.getElementById('fse-hero-greeting');
      var fseHeroWilayah = document.getElementById('fse-hero-wilayah');

      if (fseBarName) fseBarName.innerText = userObj.name || 'Teknisi Lapangan';
      if (fseHeroGreeting) fseHeroGreeting.innerText = 'Semangat Pagi, ' + (userObj.name ? userObj.name.split(' ')[0] : 'Teknisi') + '!';
      if (fseHeroWilayah) fseHeroWilayah.innerHTML = '<i class="fa-solid fa-location-dot text-emerald-300 mr-1.5"></i>Area: ' + escapeHtml(userObj.wilayah || 'Jabodetabek');

      loadDropdowns();
      loadFSEPortalData();
    } else {
      document.getElementById('fse-mobile-viewport').classList.add('hidden');
      document.getElementById('app-viewport').classList.remove('hidden');

      document.getElementById('user-profile-name').innerText = userObj.name;
      document.getElementById('user-profile-role').innerText = userObj.roleTitle;
      document.getElementById('user-avatar-badge').innerText = userObj.initials;
      document.getElementById('sidebar-role-indicator').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1"></span><span class="truncate">' + escapeHtml(userObj.indicator) + '</span>';

      applyRolePermissions(userObj);

      loadDropdowns();
      fetchTickets(1);
      loadDashboardMetrics();
      loadSectionAuxiliaryData('FSE');
      loadSectionAuxiliaryData('DataPM');
      loadSectionAuxiliaryData('DatabaseMesin');
      loadSectionAuxiliaryData('DatabaseCustomer');
      renderKPIScorecards();
    }

    if (!isSessionRestored) {
      showToast('Login Berhasil', 'Selamat datang, ' + userObj.name, 'success');
    }
  }

  function applyRolePermissions(userObj) {
    var isMonitoring = (userObj && (userObj.roleKey === 'monitoring' || userObj.roleKey === 'admin'));
    var fseBtnContainer = document.getElementById('container-monitoring-fse-action');

    if (fseBtnContainer) {
      if (isMonitoring) fseBtnContainer.classList.remove('hidden');
      else fseBtnContainer.classList.add('hidden');
    }
  }

  function handleLogout() {
    currentUser = null;
    localStorage.removeItem('atm_user_session');
    localStorage.removeItem('atm_last_activity');
    document.getElementById('app-viewport').classList.add('hidden');
    document.getElementById('fse-mobile-viewport').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
    showToast('Sesi Berakhir', 'Anda telah keluar dari aplikasi.', 'success');
  }

  function switchFSETab(tabName) {
    currentFSETab = tabName;

    var tabs = document.querySelectorAll('.fse-subview');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.add('hidden');

    var btns = document.querySelectorAll('.fse-bottom-btn');
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.remove('active', 'text-teal-700', 'font-semibold');
      btns[j].classList.add('text-slate-400');
    }

    var activeView = document.getElementById('fse-view-' + tabName);
    var activeBtn = document.getElementById('fse-nav-' + tabName);

    if (activeView) activeView.classList.remove('hidden');
    if (activeBtn) {
      activeBtn.classList.add('active', 'text-teal-700', 'font-semibold');
      activeBtn.classList.remove('text-slate-400');
    }

    if (tabName === 'tickets' || tabName === 'documents' || tabName === 'database' || tabName === 'dashboard') {
      loadFSEPortalData();
    }
  }

  function loadFSEPortalData() {
    if (!currentUser) return;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            var d = res.data;
            document.getElementById('fse-stat-mesin').innerText = d.jumlahMesin || 0;
            document.getElementById('fse-stat-cm').innerText = d.totalCM || 0;
            document.getElementById('fse-stat-pm').innerText = d.totalPM || 0;

            cachedFSEMachinesList = d.managedMachinesList || [];
            renderFSEManagedMachines(cachedFSEMachinesList);
            renderFSETickets(d.assignedTickets || []);
            renderFSEClosedDocuments(d.closedDocuments || [], d.wilayah || currentUser.wilayah);
          }
        })
        .getFSEPersonalSummary(currentUser.name, currentUser.userId);
    }
  }

  function renderFSEManagedMachines(machines) {
    var container = document.getElementById('fse-managed-machines-container');
    var countBadge = document.getElementById('fse-managed-count-badge');
    if (!container) return;

    if (countBadge) countBadge.innerText = (machines ? machines.length : 0) + ' Mesin';

    if (!machines || machines.length === 0) {
      container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs"><i class="fa-solid fa-server text-3xl mb-2 block text-slate-300"></i>Belum ada mesin ATM yang ditugaskan ke Anda.</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < machines.length; i++) {
      var m = machines[i];
      html += '<div class="soft-card-panel p-3.5 space-y-1.5 bg-white/90 border border-white shadow-sm">';
      html += '<div class="flex items-center justify-between">';
      html += '<span class="font-mono font-bold text-xs text-teal-800">' + escapeHtml(m.idMesin) + '</span>';
      html += '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">' + escapeHtml(m.status || 'Active') + '</span>';
      html += '</div>';

      html += '<div class="text-xs space-y-0.5">';
      html += '<div class="font-bold text-slate-800">' + escapeHtml(m.bank) + '</div>';
      html += '<div class="font-mono text-slate-600 text-[11px]"><i class="fa-solid fa-barcode mr-1 text-slate-400"></i>SN: ' + escapeHtml(m.serialNumber) + '</div>';
      html += '<div class="text-slate-600 text-[11px]"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>' + escapeHtml(m.lokasi) + '</div>';
      html += '<div class="text-slate-400 text-[10px] font-mono"><i class="fa-solid fa-microchip mr-1"></i>' + escapeHtml(m.tipe) + '</div>';
      html += '</div>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function filterFSEMachinesInline() {
    var q = (document.getElementById('filter-fse-machine-search').value || '').toLowerCase().trim();
    if (!cachedFSEMachinesList) return;

    var filtered = cachedFSEMachinesList.filter(function(m) {
      if (!q) return true;
      return (
        m.idMesin.toLowerCase().indexOf(q) !== -1 ||
        m.serialNumber.toLowerCase().indexOf(q) !== -1 ||
        m.bank.toLowerCase().indexOf(q) !== -1 ||
        m.lokasi.toLowerCase().indexOf(q) !== -1
      );
    });

    renderFSEManagedMachines(filtered);
  }

  function renderFSETickets(tickets) {
    window._cachedFSETickets = tickets;
    var assignedContainer = document.getElementById('fse-assigned-incoming-container');
    var assignedCountBadge = document.getElementById('fse-assigned-badge-count');
    var activeTicketsContainer = document.getElementById('fse-ticket-cards-container');
    var tabBadgeCount = document.getElementById('fse-ticket-count-badge');

    var newAssignedTickets = [];
    var inProgressTickets = [];

    for (var i = 0; i < tickets.length; i++) {
      var stLower = String(tickets[i].statusTiket || '').toLowerCase().trim();
      if (stLower === 'assign' || stLower === 'open' || stLower === 'baru') {
        newAssignedTickets.push(tickets[i]);
      } else {
        inProgressTickets.push(tickets[i]);
      }
    }

    // 1. Render Tiket Berstatus "Assign" di DASHBOARD FSE
    if (assignedCountBadge) {
      assignedCountBadge.innerText = newAssignedTickets.length + ' Baru';
      if (newAssignedTickets.length > 0) {
        assignedCountBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900 border border-amber-300 animate-pulse';
      } else {
        assignedCountBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 border border-slate-200';
      }
    }

    if (assignedContainer) {
      if (newAssignedTickets.length === 0) {
        assignedContainer.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs bg-white/60 rounded-2xl border border-slate-200/80"><i class="fa-solid fa-circle-check text-teal-600 text-xl mb-1 block"></i>Tidak ada tiket baru yang menunggu respon Anda.</div>';
      } else {
        var aHtml = '';
        for (var a = 0; a < newAssignedTickets.length; a++) {
          var at = newAssignedTickets[a];
          var aLoc = getMachineLocation(at.idMesin, at.serialNumber);

          aHtml += '<div class="soft-card-panel p-3.5 space-y-2.5 bg-gradient-to-br from-white to-amber-50/40 border border-amber-200/80 shadow-md relative">';
          aHtml += '<div class="flex items-center justify-between pb-2 border-b border-amber-100">';
          aHtml += '<div class="flex items-center gap-1.5">';
          aHtml += '<span class="font-mono font-bold text-xs text-teal-800">' + escapeHtml(at.idTiket) + '</span>';
          aHtml += '<span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-amber-500 text-white animate-pulse">Perlu Respon</span>';
          aHtml += '</div>';
          aHtml += '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300">Assign</span>';
          aHtml += '</div>';

          aHtml += '<div class="space-y-1 text-xs">';
          aHtml += '<div class="flex"><span class="w-28 text-slate-500 shrink-0 font-medium">Bank :</span><span class="font-bold text-slate-800 truncate">' + escapeHtml(at.bank) + '</span></div>';
          aHtml += '<div class="flex"><span class="w-28 text-slate-500 shrink-0 font-medium">SN Mesin :</span><span class="font-mono font-semibold text-slate-800">' + escapeHtml(at.serialNumber) + '</span></div>';
          aHtml += '<div class="flex"><span class="w-28 text-slate-500 shrink-0 font-medium">ID Mesin :</span><span class="font-mono font-bold text-teal-800">' + escapeHtml(at.idMesin) + '</span></div>';
          aHtml += '<div class="flex"><span class="w-28 text-slate-500 shrink-0 font-medium text-teal-700">Lokasi :</span><span class="text-slate-700 font-medium">' + escapeHtml(aLoc) + '</span></div>';
          aHtml += '<div class="flex"><span class="w-28 text-slate-500 shrink-0 font-medium">Problem :</span><span class="font-semibold text-rose-700">' + escapeHtml(at.problem) + '</span></div>';
          aHtml += '<div class="flex"><span class="w-28 text-slate-500 shrink-0 font-medium">Time Open :</span><span class="font-mono text-slate-600 text-[11px]">' + escapeHtml(at.tanggalTiket) + ' ' + escapeHtml(at.jamTiket) + ' WIB</span></div>';
          aHtml += '</div>';

          aHtml += '<div class="pt-2 border-t border-amber-100 flex items-center gap-2">';
          aHtml += '<button onclick="openFSETimelineModal(\'' + escapeHtml(at.idTiket) + '\')" class="px-2.5 py-1.5 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-[11px] font-semibold flex items-center gap-1 border border-slate-200 shadow-sm"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</button>';
          aHtml += '<button onclick="executeTicketAction(\'' + escapeHtml(at.idTiket) + '\', \'Respon\', { note: \'Tiket direspon oleh teknisi FSE\' })" class="flex-1 py-1.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-check"></i> Respon Tiket</button>';
          aHtml += '<button onclick="handleFSEDropdownAction(\'' + escapeHtml(at.idTiket) + '\', { value: \'Cancel\' })" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl text-[11px] font-semibold border border-rose-200">Cancel</button>';
          aHtml += '</div>';

          aHtml += '</div>';
        }
        assignedContainer.innerHTML = aHtml;
      }
    }

    // 2. Render Tiket yang Sudah Di-Respon / Dalam Pengerjaan di TAB TICKET
    if (tabBadgeCount) {
      if (inProgressTickets.length > 0) tabBadgeCount.classList.remove('hidden');
      else tabBadgeCount.classList.add('hidden');
    }

    if (activeTicketsContainer) {
      if (inProgressTickets.length === 0) {
        activeTicketsContainer.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs"><i class="fa-solid fa-circle-check text-emerald-500 text-3xl mb-2 block"></i>Semua tiket penugasan Anda telah selesai dikerjakan!</div>';
        return;
      }

      var html = '';
      for (var j = 0; j < inProgressTickets.length; j++) {
        var t = inProgressTickets[j];
        var st = t.statusTiket || 'Respon';
        var sLower = st.toLowerCase();
        var badge = getStatusBadgeHtml(st);
        var machineLoc = getMachineLocation(t.idMesin, t.serialNumber);

        var pureNote = t.noteDispatcher || t.note || '-';
        if (pureNote.indexOf(' | [') !== -1) {
          pureNote = pureNote.split(' | [')[0].trim();
        }

        html += '<div class="soft-card-panel p-3.5 space-y-2.5 bg-white/90 border border-white shadow-sm">';
        html += '<div class="flex items-center justify-between pb-2 border-b border-slate-100">';
        html += '<span class="font-mono font-bold text-xs text-teal-800">' + escapeHtml(t.idTiket) + '</span>';
        html += badge;
        html += '</div>';

        html += '<div class="space-y-1 text-xs">';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">Bank :</span><span class="font-bold text-slate-800 truncate">' + escapeHtml(t.bank) + '</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">SN Mesin :</span><span class="font-mono font-semibold text-slate-800">' + escapeHtml(t.serialNumber) + '</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">ID Mesin :</span><span class="font-mono font-bold text-teal-800">' + escapeHtml(t.idMesin) + '</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium text-teal-700">Lokasi :</span><span class="text-slate-700 font-medium">' + escapeHtml(machineLoc) + '</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">Time Open :</span><span class="font-mono text-slate-700">' + escapeHtml(t.tanggalTiket) + ' ' + escapeHtml(t.jamTiket) + ' WIB</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">Problem :</span><span class="font-semibold text-rose-700">' + escapeHtml(t.problem) + '</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">vendor/PIC :</span><span class="text-slate-700 font-medium">' + escapeHtml(t.picBank || '-') + '</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">Dispatcher :</span><span class="text-teal-700 font-semibold">' + escapeHtml(t.dispatcher || 'Monitoring') + '</span></div>';
        html += '<div class="flex"><span class="w-32 text-slate-500 shrink-0 font-medium">Note :</span><span class="text-slate-600 italic">' + escapeHtml(pureNote) + '</span></div>';
        
        if (t.alasanPending) {
          html += '<div class="flex flex-col pt-1.5 border-t border-dashed border-amber-200 mt-1">';
          html += '<div class="flex items-center justify-between">';
          html += '<span class="text-amber-700 font-semibold"><i class="fa-solid fa-pause text-[10px] mr-1"></i>Status Pending :</span>';
          if (t.fotoPendingEvidence) {
            html += '<button type="button" onclick="viewImageModal(\'' + escapeHtml(t.fotoPendingEvidence) + '\', \'Bukti Lokasi Tutup - ' + escapeHtml(t.idTiket) + '\')" class="px-2 py-0.5 rounded-lg bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-bold hover:bg-amber-200 transition flex items-center gap-1"><i class="fa-solid fa-image"></i> Lihat Foto</button>';
          }
          html += '</div>';
          html += '<span class="text-amber-800 text-[11px] font-medium">' + escapeHtml(t.alasanPending) + ' (Lanjutan: ' + escapeHtml(t.jadwalLanjutanPending || '-') + ')</span>';
          html += '</div>';
        }

        if (t.fotoFeReport && (sLower === 'solving' || sLower === 'solved')) {
          html += '<div class="pt-1.5 flex justify-end">';
          html += '<button type="button" onclick="viewImageModal(\'' + escapeHtml(t.fotoFeReport) + '\', \'Foto FE Report - ' + escapeHtml(t.idTiket) + '\')" class="px-2.5 py-1 rounded-lg bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 font-bold text-[11px] flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-file-image"></i> Lihat Foto FE Report</button>';
          html += '</div>';
        }

        html += '</div>';

  function getMachineLocation(idMesin, serialNumber) {
    if (cachedDropdowns && cachedDropdowns.machines) {
      var mm = cachedDropdowns.machines.find(function(m) {
        return m.idMesin === idMesin || m.serialNumber === serialNumber;
      });
      if (mm && mm.lokasi) return mm.lokasi;
    }
    if (cachedFSEMachinesList) {
      var mm2 = cachedFSEMachinesList.find(function(m) {
        return m.idMesin === idMesin || m.serialNumber === serialNumber;
      });
      if (mm2 && mm2.lokasi) return mm2.lokasi;
    }
    return '-';
  }

  function handleFSEDropdownAction(ticketId, selectEl) {
    var action = selectEl.value;
    if (!action) return;
    if (selectEl.tagName === 'SELECT') selectEl.value = "";
    activeActionTicketId = ticketId;

    var now = new Date();
    var nowStr = UtilitiesDateString(now);

    if (action === 'Appointment' || action === 'Re-Appointment') {
      document.getElementById('fse-appt-ticket-id').innerText = ticketId;
      document.getElementById('fse-appt-date').value = now.toISOString().split('T')[0];
      document.getElementById('fse-appt-time').value = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
      document.getElementById('fse-appt-note').value = '';
      document.getElementById('modal-fse-appointment').classList.remove('hidden');
    } else if (action === 'Handling') {
      document.getElementById('fse-handling-ticket-id').innerText = ticketId;
      document.getElementById('fse-handling-note').value = '';
      document.getElementById('modal-fse-handling').classList.remove('hidden');
    } else if (action === 'Solved') {
      document.getElementById('fse-solved-ticket-id').innerText = ticketId;
      document.getElementById('fse-solved-now').value = nowStr;
      document.getElementById('fse-solved-no-fe').value = '';
      document.getElementById('fse-solved-note').value = '';
      document.getElementById('fse-solved-file').value = '';
      document.getElementById('btn-preview-solved-img').classList.add('hidden');
      document.getElementById('modal-fse-solved').classList.remove('hidden');
    } else if (action === 'Cancel') {
      document.getElementById('fse-cancel-ticket-id').innerText = ticketId;
      document.getElementById('fse-cancel-now').value = nowStr;
      document.getElementById('fse-cancel-note').value = '';
      document.getElementById('fse-cancel-file').value = '';
      document.getElementById('btn-preview-cancel-img').classList.add('hidden');
      document.getElementById('modal-fse-cancel').classList.remove('hidden');
    } else if (action === 'Pending') {
      document.getElementById('fse-pending-ticket-id').innerText = ticketId;
      document.getElementById('fse-pending-now').value = nowStr;
      document.getElementById('fse-pending-note').value = '';
      document.getElementById('fse-pending-alasan').value = 'Pending by lokasi tutup';
      
      var pendingFileInput = document.getElementById('fse-pending-file');
      if (pendingFileInput) pendingFileInput.value = '';
      var btnPrevPending = document.getElementById('btn-preview-pending-img');
      if (btnPrevPending) btnPrevPending.classList.add('hidden');
      
      handlePendingAlasanChange(document.getElementById('fse-pending-alasan'));

      var tomorrow = new Date(now.getTime() + (24 * 60 * 60 * 1000));
      tomorrow.setHours(9, 0, 0, 0);
      var localTomorrow = new Date(tomorrow.getTime() - (tomorrow.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
      document.getElementById('fse-pending-lanjutan').value = localTomorrow;

      document.getElementById('modal-fse-pending').classList.remove('hidden');
    } else if (action === 'Arrival' || action === 'Respon' || action === 'Waiting Vendor') {
      executeTicketAction(ticketId, action, { note: 'Status diperbarui ke ' + action });
    }
  }

  function UtilitiesDateString(d) {
    var yr = d.getFullYear();
    var mo = ('0' + (d.getMonth() + 1)).slice(-2);
    var dy = ('0' + d.getDate()).slice(-2);
    var hr = ('0' + d.getHours()).slice(-2);
    var mn = ('0' + d.getMinutes()).slice(-2);
    var sc = ('0' + d.getSeconds()).slice(-2);
    return yr + '-' + mo + '-' + dy + ' ' + hr + ':' + mn + ':' + sc + ' WIB';
  }

  function formatDriveImageUrl(url) {
    if (!url) return '';
    var trimmed = String(url).trim();
    if (trimmed.indexOf('drive.google.com') !== -1) {
      var matchId = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/id=([a-zA-Z0-9_-]+)/);
      if (matchId && matchId[1]) {
        return 'https://drive.google.com/thumbnail?id=' + matchId[1] + '&sz=w1200';
      }
    }
    return trimmed;
  }

  function viewImageModal(imgSrc, title) {
    var modal = document.getElementById('modal-image-preview');

    var modalTitle = document.getElementById('preview-modal-title');
    var extLink = document.getElementById('preview-modal-external-link');

    if (!modal || !modalImg) return;

    if (fallbackMsg) fallbackMsg.classList.add('hidden');
    modalImg.classList.remove('hidden');

    var streamUrl = formatDriveImageUrl(imgSrc);
    modalImg.src = streamUrl;

    if (extLink) {
      extLink.href = imgSrc;
      if (imgSrc && imgSrc.indexOf('data:image') === 0) {
        extLink.classList.add('hidden');
      } else {
        extLink.classList.remove('hidden');
      }

    if (modalTitle) modalTitle.innerHTML = '<i class="fa-solid fa-image text-teal-600 mr-1.5"></i>' + escapeHtml(title || 'Preview Bukti Foto');
    modal.classList.remove('hidden');

  function renderFSEClosedDocuments(documents, wilayahFSE) {
    window._cachedClosedDocuments = documents;
    var container = document.getElementById('fse-document-cards-container');
    var docBadge = document.getElementById('fse-doc-alert-badge');
    if (!container) return;

    // Filter dokumen untuk menu Kirim Dokumen: Khusus tiket Closed
    var closedDocsOnly = (documents || []).filter(function(d) {
      var st = String(d.statusTiket || '').toLowerCase();
      return st === 'closed';
    });

    if (!closedDocsOnly || closedDocsOnly.length === 0) {
      if (docBadge) docBadge.classList.add('hidden');
      container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs"><i class="fa-solid fa-folder-open text-3xl mb-2 block text-slate-300"></i>Tidak ada dokumen hardcopy yang menunggu pengiriman.</div>';
      updateBatchSendButtonState();
      return;
    }

    // SLA Deploy: Maksimal 3 Menit (3 * 60 * 1000 ms), ubah ke 3 * 24 * 60 * 60 * 1000 untuk 3 hari mode produksi
    var SLA_DEPLOY_LIMIT_MS = 3 * 60 * 1000; 
    var pendingCount = 0;
    var html = '';

    for (var i = 0; i < closedDocsOnly.length; i++) {
      var doc = closedDocsOnly[i];
      var rawHc = String(doc.hardcopyStatus || 'Belum Dikirim').trim().toLowerCase();
      var isReceived = (rawHc === 'diterima');
      var isSent = (rawHc === 'sedang dikirim' || rawHc.indexOf('sedang') !== -1 || (doc.noResi && doc.noResi !== '-' && doc.noResi !== ''));

      if (!isReceived) pendingCount++;

      var elapsedMs = 0;
      if (doc.closedAt) {
        var closedTime = new Date(doc.closedAt.replace(/-/g, '/')).getTime();
        if (!isNaN(closedTime)) {
          elapsedMs = Date.now() - closedTime;
        }
      }
      var isOverdue = (elapsedMs > SLA_DEPLOY_LIMIT_MS);

      var docLokasi = getMachineLocation(doc.idMesin, doc.serialNumber);

      var noFeDisplay = String(doc.noFeReport || '').trim();
      if (!noFeDisplay || noFeDisplay === '-') {
        if (doc.note && doc.note.indexOf('[No. FE:') !== -1) {
          var matchFe = doc.note.match(/\[No\.\s*FE:\s*(.*?)\]/i);
          if (matchFe) noFeDisplay = matchFe[1].trim();
        }
      }
      if (!noFeDisplay || noFeDisplay === '-') {
        if (doc.timelineHistory && doc.timelineHistory !== '[]') {
          try {
            var thArr = JSON.parse(doc.timelineHistory);
            for (var thI = 0; thI < thArr.length; thI++) {
              if (thArr[thI].noFeReport) { noFeDisplay = thArr[thI].noFeReport; break; }
              if (thArr[thI].note && thArr[thI].note.indexOf('[No. FE:') !== -1) {
                var mFeTh = thArr[thI].note.match(/\[No\.\s*FE:\s*(.*?)\]/i);
                if (mFeTh) { noFeDisplay = mFeTh[1].trim(); break; }
              }
            }
          } catch(e) {}
        }
      }
      if (!noFeDisplay) noFeDisplay = '-';

      var isSelected = selectedDocumentIds.indexOf(doc.idTiket) !== -1;

      html += '<div class="soft-card-panel p-3.5 space-y-2.5 bg-white/90 border border-white shadow-sm">';
      
      html += '<div class="flex items-center justify-between pb-2 border-b border-slate-100">';
      html += '<div class="flex items-center gap-2">';
      if (!isReceived) {
        html += '<input type="checkbox" id="chk-doc-' + escapeHtml(doc.idTiket) + '" onchange="toggleDocumentSelection(\'' + escapeHtml(doc.idTiket) + '\')" ' + (isSelected ? 'checked' : '') + ' class="w-4 h-4 rounded text-teal-600 focus:ring-teal-500 border-slate-300 cursor-pointer">';
      }
      html += '<span class="font-mono font-bold text-xs text-teal-800">' + escapeHtml(doc.idTiket) + '</span>';
      html += '</div>';

      /* LOGIKA BADGE STATUS PENGIRIMAN:
         - Diterima Kantor: Hijau
         - Sedang Dikirim: Biru (Kurir / No Resi)
         - Belum Dikirim & Overdue (> 3 Menit): Merah Berkedip dengan Warning Icon
         - Belum Dikirim & Normal (<= 3 Menit): Oranye "Dokumen belum dikirim"
      */
      if (isReceived) {
        html += '<span class="px-2 py-0.5 rounded-full text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold"><i class="fa-solid fa-check-double mr-1"></i>Diterima Kantor</span>';
      } else if (isSent) {
        var sentTag = (doc.namaEkspedisi && doc.namaEkspedisi !== '-') ? (doc.namaEkspedisi + ' - ' + (doc.noResi || 'Resi Ada')) : 'Sedang Dikirim';
        html += '<span class="px-2 py-0.5 rounded-full text-[10px] bg-sky-50 text-sky-700 border border-sky-200 font-bold truncate max-w-[160px]"><i class="fa-solid fa-truck-fast mr-1"></i>' + escapeHtml(sentTag) + '</span>';

  function handleConfirmBatchShipping(event) {
    if (event) event.preventDefault();
    if (!selectedDocumentIds || selectedDocumentIds.length === 0) return;

    var methods = document.getElementsByName('shipping_method');
    var selectedMethod = 'Kirim Sendiri ke Kantor';
    for (var i = 0; i < methods.length; i++) {
      if (methods[i].checked) {
        selectedMethod = methods[i].value;
        break;
      }
    }

    var payload = {
      metode: selectedMethod,
      namaEkspedisi: '-',
      noResi: '-',
      jenisPengiriman: '-'
    };

    if (selectedMethod === 'Kirim Ekspedisi') {
      var expNameEl = document.getElementById('shipping-input-ekspedisi');
      var resiEl = document.getElementById('shipping-input-resi');
      var jenisEl = document.getElementById('shipping-input-jenis');

      var expName = expNameEl ? expNameEl.value : 'JNE';
      var resiVal = resiEl ? resiEl.value.trim() : '';
      var jenisVal = jenisEl ? jenisEl.value : 'Reguler';

      if (!resiVal) {
        showToast('Nomor Resi Wajib', 'Silakan masukkan nomor resi pengiriman ekspedisi.', 'error');
        if (resiEl) resiEl.focus();
        return;
      }

      payload.namaEkspedisi = expName;
      payload.noResi = resiVal;
      payload.jenisPengiriman = jenisVal;
    }

    var btn = document.getElementById('btn-submit-shipping-batch');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses Pengiriman...';
    }

    var count = selectedDocumentIds.length;
    var userName = (currentUser && currentUser.name) ? currentUser.name : 'FSE';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Konfirmasi &amp; Kirim Berkas</span>';
          }
          closeFSEShippingModal();

          if (res && res.status === 'success') {
            showToast('Pengiriman Diproses', res.message, 'success');
            selectedDocumentIds = [];
            loadFSEPortalData();
          } else {
            showToast('Gagal Kirim', res ? res.message : 'Kendala server', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Konfirmasi &amp; Kirim Berkas</span>';
          }
          showToast('Error Server', 'Kendala koneksi: ' + err, 'error');
        })
        .submitBatchDispatchShipping(selectedDocumentIds, payload, userName);
    } else {
      setTimeout(function() {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Konfirmasi &amp; Kirim Berkas</span>';
        }

        showToast('Pengiriman Diproses (Demo)', count + ' berkas berhasil ditandai ' + selectedMethod, 'success');
        selectedDocumentIds = [];
        loadFSEPortalData();
      }, 500);
    }
  }

  function handleCSVImportSubmit(event) {
    event.preventDefault();
    var targetType = document.getElementById('csv-target-type').value;
    var fileInput = document.getElementById('input-csv-file');

    if (!fileInput.files || !fileInput.files[0]) {
      showToast('Peringatan', 'Silakan pilih berkas CSV terlebih dahulu.', 'error');
      return;
    }

    var btn = document.getElementById('btn-submit-csv');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses CSV...'; }

    var reader = new FileReader();
    reader.onload = function(e) {
      var csvText = e.target.result;
      var rows = parseCSVText(csvText);

      if (rows.length > 0) {
        var firstRowJoined = rows[0].join(' ').toLowerCase();
        if (firstRowJoined.indexOf('id') !== -1 || firstRowJoined.indexOf('bank') !== -1 || firstRowJoined.indexOf('nama') !== -1) {
          rows = rows.slice(1);
        }
      }

      if (rows.length === 0) {
        if (btn) { btn.disabled = false; btn.innerHTML = 'Mulai Impor'; }
        showToast('CSV Kosong', 'Berkas CSV tidak memuat baris data yang valid.', 'error');
        return;
      }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            closeCSVImportModal();
            if (btn) { btn.disabled = false; btn.innerHTML = 'Mulai Impor'; }

            if (res && res.status === 'success') {
              showToast('Impor Berhasil', res.message, 'success');
              if (targetType === 'Machines') loadSectionAuxiliaryData('DatabaseMesin');
              else if (targetType === 'FSE') loadSectionAuxiliaryData('FSE');
              else if (targetType === 'Customers') loadSectionAuxiliaryData('DatabaseCustomer');
            } else {
              showToast('Gagal Impor', res ? res.message : 'Error backend', 'error');
            }
          })
          .withFailureHandler(function(err) {
            if (btn) { btn.disabled = false; btn.innerHTML = 'Mulai Impor'; }
            showToast('Error Server', 'Kendala server: ' + err, 'error');
          })
          .importCSVData(targetType, rows, currentUser);
      }
    };
    reader.readAsText(fileInput.files[0]);
  }

  function parseCSVText(text) {
    var lines = text.split(/\r\n|\n/);
    var result = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var cols = line.split(',');
      for (var c = 0; c < cols.length; c++) {
        cols[c] = cols[c].replace(/^["']|["']$/g, '').trim();
      }
      result.push(cols);
    }
    return result;
  }

  function startLiveClock() {
    setInterval(function() {
      var now = new Date();
      var h = ('0' + now.getHours()).slice(-2);
      var m = ('0' + now.getMinutes()).slice(-2);
      var s = ('0' + now.getSeconds()).slice(-2);
      var timeStr = h + ':' + m + ':' + s + ' WIB';

      var el1 = document.getElementById('live-clock');
      var el2 = document.getElementById('fse-live-clock');
      if (el1) el1.innerText = timeStr;
      if (el2) el2.innerText = h + ':' + m + ' WIB';
    }, 1000);
  }

  function navigateTo(sectionId) {
    currentSection = sectionId;

    var navItems = document.querySelectorAll('.soft-nav-pill');
    for (var i = 0; i < navItems.length; i++) navItems[i].classList.remove('active');
    var targetNav = document.getElementById('nav-' + sectionId);
    if (targetNav) targetNav.classList.add('active');

    var views = document.querySelectorAll('.view-section');
    for (var j = 0; j < views.length; j++) views[j].classList.add('hidden');
    var activeView = document.getElementById('sec-' + sectionId);
    if (activeView) activeView.classList.remove('hidden');

    var titleEl = document.getElementById('section-title');
    var subTitleEl = document.getElementById('section-subtitle');

    var metadata = {
      Dashboard: { title: 'DASHBOARD MONITORING', sub: 'Live Telemetry & ATM Maintenance Incident Dispatcher' },
      FSE: { title: 'DATA FIELD SERVICE ENGINEER', sub: 'Direktori & Status Ketersediaan Teknisi Lapangan' },
      Ticket: { title: 'MANAJEMEN TIKET & DISPATCH', sub: 'Pelacakan Antrean Tiket dan Aksi Lifecycle Status' },
      DataPM: { title: 'DATA PREVENTIVE MAINTENANCE (PM)', sub: 'Monitoring Jadwal & Riwayat Servis Berkala Mesin ATM' },
      DatabaseMesin: { title: 'DATABASE MESIN ATM', sub: 'Registrasi Aset & Inventaris Mesin ATM Perbankan' },

      ReportingFSE: { title: 'REPORTING PRODUKTIVITAS FSE', sub: 'Agregasi Penyelesaian Tiket & Analisis MTTR' },
      SLAAchievement: { title: 'SERVICE LEVEL AGREEMENT (SLA)', sub: 'Kepatuhan Respon & Kecepatan Solving Insiden' },
      KPIAchievement: { title: 'KPI ACHIEVEMENT SCORECARD', sub: 'Evaluasi Kinerja Petugas Monitoring & Tim FSE' }
    };

    if (titleEl && metadata[sectionId]) {
      titleEl.innerText = metadata[sectionId].title;
      subTitleEl.innerText = metadata[sectionId].sub;

    if (sectionId === 'Ticket') fetchTickets(currentPage || 1);
    else if (sectionId === 'Dashboard') { loadDashboardMetrics(); fetchTickets(1); }

  function fetchTickets(page) {
    currentPage = page || 1;
    var searchEl = document.getElementById('filter-search');
    var statusEl = document.getElementById('filter-status');
    var bankEl = document.getElementById('filter-bank');

    var searchVal = searchEl ? String(searchEl.value || '').trim() : '';
    var statusVal = statusEl ? String(statusEl.value || 'ALL').trim() : 'ALL';
    var bankVal = bankEl ? String(bankEl.value || 'ALL').trim() : 'ALL';

    var tbody = document.getElementById('tickets-table-body');
    if (tbody && (!currentTicketsList || currentTicketsList.length === 0)) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-slate-400 font-mono text-xs"><i class="fa-solid fa-spinner fa-spin text-teal-600 mr-2"></i>Mengambil antrean tiket...</td></tr>';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            currentTicketsList = res.tickets || [];
            currentPage = res.page || 1;
            totalPages = res.totalPages || 1;
            totalItems = res.totalItems || 0;
            renderTicketsTable(currentTicketsList);
            updatePaginationControls();
          }
        })
        .getTicketsPaginated(currentPage, pageSize, searchVal, statusVal, bankVal);
    }
  }

  function debounceSearch() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(function() { fetchTickets(1); }, 350);
  }

  function changePage(direction) {
    var target = currentPage + direction;
    if (target >= 1 && target <= totalPages) fetchTickets(target);
  }

  function updatePaginationControls() {
    var pagStart = totalItems === 0 ? 0 : ((currentPage - 1) * pageSize) + 1;
    var pagEnd = Math.min(currentPage * pageSize, totalItems);

    var sEl = document.getElementById('pag-start');
    var eEl = document.getElementById('pag-end');
    var tEl = document.getElementById('pag-total');
    var cEl = document.getElementById('pag-current');

    if (sEl) sEl.innerText = pagStart;
    if (eEl) eEl.innerText = pagEnd;
    if (tEl) tEl.innerText = totalItems;
    if (cEl) cEl.innerText = currentPage + ' / ' + totalPages;

    var btnPrev = document.getElementById('btn-prev-page');
    var btnNext = document.getElementById('btn-next-page');
    if (btnPrev) btnPrev.disabled = (currentPage <= 1);
    if (btnNext) btnNext.disabled = (currentPage >= totalPages);
  }

  function renderTicketsTable(tickets) {
    var tbody = document.getElementById('tickets-table-body');
    if (!tbody) return;

    if (!tickets || tickets.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-400 font-mono text-xs"><i class="fa-solid fa-inbox text-2xl mb-2 block text-slate-300"></i>Tidak ada tiket yang cocok</td></tr>';
      return;
    }

    var isMonitoring = (currentUser && (currentUser.roleKey === 'monitoring' || currentUser.roleKey === 'admin'));
    var html = '';

    for (var i = 0; i < tickets.length; i++) {
      var t = tickets[i];
      var badge = getStatusBadgeHtml(t.statusTiket);
      var stLower = String(t.statusTiket || '').toLowerCase();

      var rawTipe = String(t.tipeTiket || 'CM').toLowerCase();
      var shorthandTipe = 'CM';
      var tipeBadgeClass = 'bg-rose-50 text-rose-700 border-rose-200';

      if (rawTipe.indexOf('preventive') !== -1 || rawTipe === 'pm') {
        shorthandTipe = 'PM';
        tipeBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
      } else if (rawTipe.indexOf('uat') !== -1 || rawTipe.indexOf('project') !== -1) {
        shorthandTipe = 'UAT/Project';
        tipeBadgeClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
      } else if (rawTipe.indexOf('activation') !== -1) {
        shorthandTipe = 'Activation';
        tipeBadgeClass = 'bg-sky-50 text-sky-700 border-sky-200';
      }

      var pureNote = t.noteDispatcher || t.note || '-';
      if (pureNote.indexOf(' | [') !== -1) {
        pureNote = pureNote.split(' | [')[0].trim();
      }

      html += '<tr class="hover:bg-white/80 transition">';
      html += '<td class="p-3 font-mono font-bold text-teal-700 whitespace-nowrap">' + escapeHtml(t.idTiket) + '</td>';
      html += '<td class="p-3">';
      html += '<div class="font-semibold text-slate-800">' + escapeHtml(t.bank) + '</div>';
      html += '<div class="text-[11px] text-slate-500 font-mono">' + escapeHtml(t.serialNumber) + ' (' + escapeHtml(t.idMesin) + ')</div>';
      html += '</td>';
      html += '<td class="p-3 whitespace-nowrap">';
      html += '<div class="text-slate-700 font-mono">' + escapeHtml(t.tanggalTiket) + '</div>';
      html += '<div class="text-[10px] text-slate-400 font-mono">' + escapeHtml(t.jamTiket) + '</div>';
      html += '</td>';
      html += '<td class="p-3 whitespace-nowrap"><span class="px-2 py-0.5 rounded-md font-bold text-[11px] border ' + tipeBadgeClass + '">' + shorthandTipe + '</span></td>';
      html += '<td class="p-3 whitespace-nowrap">';
      html += '<span class="px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-700 font-medium">' + escapeHtml(t.namaEngineer) + '</span>';
      html += '</td>';
      html += '<td class="p-3 max-w-xs">';
      html += '<div class="font-medium text-slate-800 truncate" title="' + escapeHtml(t.problem) + '">' + escapeHtml(t.problem) + '</div>';
      if (pureNote && pureNote !== '-') {
        html += '<div class="text-[10px] text-slate-500 italic truncate" title="' + escapeHtml(pureNote) + '">Note: ' + escapeHtml(pureNote) + '</div>';
      }
      html += '</td>';
      html += '<td class="p-3 whitespace-nowrap">' + badge + '</td>';
      html += '<td class="p-3 text-center whitespace-nowrap">';
      html += '<div class="flex items-center justify-center gap-1.5">';
      
      html += '<button onclick="openFSETimelineModal(\'' + escapeHtml(t.idTiket) + '\')" title="Lihat Riwayat" class="px-2.5 py-1 text-[11px] rounded-lg bg-teal-50 border border-teal-200 text-teal-700 hover:bg-teal-600 hover:text-white transition flex items-center gap-1 shadow-sm font-medium">';
      html += '<i class="fa-solid fa-clock-rotate-left text-[10px]"></i> Riwayat';
      html += '</button>';

      if (isMonitoring && (stLower === 'solved' || stLower === 'solving')) {
        html += '<button onclick="executeTicketAction(\'' + escapeHtml(t.idTiket) + '\', \'Closed\', { note: \'Tiket ditutup permanen oleh Monitoring\' })" title="Tutup Tiket Permanen (Pindah ke Kirim Dokumen FSE)" class="px-2.5 py-1 text-[11px] rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold transition flex items-center gap-1 shadow-sm">';
        html += '<i class="fa-solid fa-lock text-[10px]"></i> Closed';
        html += '</button>';
      }

      html += '</div>';
      html += '</td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;

    renderDashboardRecent(tickets);
  }

  function renderDashboardRecent(tickets) {
    var dashTbody = document.getElementById('dashboard-recent-tickets');
    if (!dashTbody) return;

    var slice = tickets.slice(0, 5);
    var html = '';
    for (var i = 0; i < slice.length; i++) {
      var item = slice[i];
      html += '<tr class="hover:bg-white/60 transition">';
      html += '<td class="p-3 font-mono font-semibold text-teal-700">' + escapeHtml(item.idTiket) + '</td>';
      html += '<td class="p-3 font-medium text-slate-800">' + escapeHtml(item.bank) + '</td>';
      html += '<td class="p-3 font-mono text-slate-500">' + escapeHtml(item.serialNumber) + '</td>';
      html += '<td class="p-3 text-slate-700">' + escapeHtml(item.namaEngineer) + '</td>';
      html += '<td class="p-3">' + getStatusBadgeHtml(item.statusTiket) + '</td>';
      html += '</tr>';
    }
    dashTbody.innerHTML = html;

  function getStatusBadgeHtml(status) {
    var s = String(status || '').trim();
    var colorClass = 'bg-slate-100 text-slate-700 border-slate-200';

    if (s === 'Assign') colorClass = 'bg-amber-100 text-amber-900 border-amber-300 font-bold';
    else if (s === 'Open' || s === 'Baru') colorClass = 'bg-amber-50 text-amber-700 border-amber-200';
    else if (s === 'Respon') colorClass = 'bg-sky-50 text-sky-700 border-sky-200';
    else if (s === 'Appointment' || s === 'Re-Appointment') colorClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
    else if (s === 'Arrival') colorClass = 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200';
    else if (s === 'Handling' || s === 'Proses') colorClass = 'bg-blue-50 text-blue-700 border-blue-200';
    else if (s === 'Pending') colorClass = 'bg-amber-100 text-amber-900 border-amber-300 font-bold';
    else if (s === 'Waiting Vendor') colorClass = 'bg-yellow-50 text-yellow-700 border-yellow-300';
    else if (s === 'Solving' || s === 'Solved' || s === 'Selesai') colorClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
    else if (s === 'Closed') colorClass = 'bg-purple-50 text-purple-700 border-purple-300 font-bold';
    else if (s === 'Take a Part') colorClass = 'bg-orange-50 text-orange-700 border-orange-200';
    else if (s === 'Cancel' || s === 'Batal') colorClass = 'bg-rose-50 text-rose-700 border-rose-200';

    return '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ' + colorClass + '">' + escapeHtml(s) + '</span>';
  }

  function loadDashboardMetrics() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            var d = res.data;
            document.getElementById('stat-total').innerText = d.totalTickets;
            document.getElementById('stat-open').innerText = d.openTickets;
            document.getElementById('stat-handling').innerText = d.handlingTickets;
            document.getElementById('stat-solved').innerText = d.solvingTickets;

            updateDistributionBars(d.totalTickets, d.solvingTickets, d.handlingTickets, d.openTickets);
          }
        })
        .getSectionData('DashboardMetrics');
    }
  }

  function updateDistributionBars(total, solved, handling, open) {
    if (total <= 0) total = 1;
    var pSolved = Math.round((solved / total) * 100);
    var pHandling = Math.round((handling / total) * 100);
    var pOpen = Math.round((open / total) * 100);

    var distS = document.getElementById('dist-solving');
    var barS = document.getElementById('dist-bar-solving');
    var distH = document.getElementById('dist-handling');
    var barH = document.getElementById('dist-bar-handling');
    var distO = document.getElementById('dist-open');
    var barO = document.getElementById('dist-bar-open');

    if (distS) distS.innerText = pSolved + '%';
    if (barS) barS.style.width = pSolved + '%';
    if (distH) distH.innerText = pHandling + '%';
    if (barH) barH.style.width = pHandling + '%';
    if (distO) distO.innerText = pOpen + '%';
    if (barO) barO.style.width = pOpen + '%';
  }

  function loadSectionAuxiliaryData(section) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {

        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {

            if (section === 'ReportingFSE') renderReportingCards(res.data);
          }

        .getSectionData(section);
    }
  }

      var statusColor = (item.status === 'Aktif') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200';

      html += '<tr class="hover:bg-white/80 transition">';

      html += '<td class="p-3"><div class="font-semibold text-slate-800">' + escapeHtml(item.nama) + '</div><div class="text-[10px] text-slate-400 font-mono">' + escapeHtml(item.noHp) + '</div></td>';

      html += '<td class="p-3 text-center font-mono font-bold text-slate-700 whitespace-nowrap">' + (item.jumlahMesin || 0) + ' Mesin</td>';

      html += '<td class="p-3 text-center font-mono text-slate-700 whitespace-nowrap">' + escapeHtml(item.pmAchievement || '-') + '</td>';
      html += '<td class="p-3 text-center whitespace-nowrap"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold border ' + statusColor + '">' + escapeHtml(item.status) + '</span></td>';
      
      html += '<td class="p-3 text-center whitespace-nowrap">';
      if (isMonitoring) {
        html += '<div class="flex items-center justify-center gap-1.5">';
        html += '<button onclick="openEditFSEModal(\'' + escapeHtml(item.userId) + '\')" title="Edit Data & Kelolaan Mesin" class="w-7 h-7 rounded-lg bg-teal-50 hover:bg-teal-600 hover:text-white text-teal-700 flex items-center justify-center transition shadow-sm"><i class="fa-solid fa-pen-to-square text-xs"></i></button>';
        html += '<button onclick="toggleFSEStatusAction(\'' + escapeHtml(item.userId) + '\', \'' + escapeHtml(item.status) + '\')" class="w-7 h-7 rounded-lg bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-700 flex items-center justify-center transition shadow-sm"><i class="fa-solid fa-ban text-xs"></i></button>';
        html += '</div>';
      } else {
        html += '<span class="text-slate-400 text-[10px]">Read-only</span>';
      }
      html += '</td>';
      html += '</tr>';
    }

    tbody.innerHTML = html;
  }

  function handleFSESearchInput() {
    var query = document.getElementById('filter-fse-search').value.toLowerCase().trim();
    var clearBtn = document.getElementById('btn-clear-fse-search');

    if (clearBtn) {
      if (query !== '') clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
    }

    var filtered = currentFSEList.filter(function(item) {
      if (!query) return true;
      return (
        item.userId.toLowerCase().indexOf(query) !== -1 ||
        item.nama.toLowerCase().indexOf(query) !== -1 ||
        item.wilayah.toLowerCase().indexOf(query) !== -1 ||
        item.noHp.toLowerCase().indexOf(query) !== -1
      );
    });

    renderFSETable(filtered);
  }

  function clearFSESearch() {
    var searchInput = document.getElementById('filter-fse-search');
    var clearBtn = document.getElementById('btn-clear-fse-search');
    if (searchInput) searchInput.value = '';
    if (clearBtn) clearBtn.classList.add('hidden');
    renderFSETable(currentFSEList);
  }

  function openCreateFSEModal() {
    document.getElementById('form-new-fse').reset();
    document.getElementById('modal-create-fse').classList.remove('hidden');
  }
  function closeCreateFSEModal() { document.getElementById('modal-create-fse').classList.add('hidden'); }

  function handleCreateFSESubmit(e) {
    e.preventDefault();
    var payload = {
      nama: document.getElementById('input-fse-nama').value.trim(),
      noHp: document.getElementById('input-fse-hp').value.trim(),
      password: document.getElementById('input-fse-password').value.trim(),
      wilayah: document.getElementById('input-fse-wilayah').value.trim(),
      kelolaanMesin: parseInt(document.getElementById('input-fse-mesin').value, 10) || 0
    };
    closeCreateFSEModal();
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          showToast('FSE Didaftarkan', res.message, 'success');
          loadSectionAuxiliaryData('FSE');
          loadDropdowns();
        })
        .registerFSE(payload, currentUser);
    }
  }

  function openEditFSEModal(userId) {
    var target = currentFSEList.find(function(item) { return item.userId === userId; });
    if (!target) return;
    document.getElementById('edit-fse-userid').value = target.userId;
    document.getElementById('edit-fse-nama').value = target.nama;
    document.getElementById('edit-fse-hp').value = target.noHp;
    document.getElementById('edit-fse-wilayah').value = target.wilayah;
    document.getElementById('edit-fse-mesin').value = target.jumlahMesin || 0;
    document.getElementById('edit-fse-status').value = target.status || 'Aktif';
    document.getElementById('modal-edit-fse').classList.remove('hidden');
  }
  function closeEditFSEModal() { document.getElementById('modal-edit-fse').classList.add('hidden'); }

  function handleEditFSESubmit(e) {
    e.preventDefault();
    var payload = {
      userId: document.getElementById('edit-fse-userid').value,
      nama: document.getElementById('edit-fse-nama').value.trim(),
      noHp: document.getElementById('edit-fse-hp').value.trim(),
      wilayah: document.getElementById('edit-fse-wilayah').value.trim(),
      kelolaanMesin: parseInt(document.getElementById('edit-fse-mesin').value, 10) || 0,
      status: document.getElementById('edit-fse-status').value
    };
    closeEditFSEModal();
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          showToast('Data Diperbarui', res.message, 'success');
          loadSectionAuxiliaryData('FSE');
          loadDropdowns();
        })
        .updateFSE(payload, currentUser);
    }
  }

  function toggleFSEStatusAction(userId, currentStatus) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          showToast('Status Diubah', res.message, 'success');
          loadSectionAuxiliaryData('FSE');
        })
        .toggleFSEStatus(userId, currentStatus, currentUser);
    }
  }

  function renderPMTable(list) {
    var tbody = document.getElementById('pm-table-body');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-slate-400 font-mono text-xs">Tidak ada data Preventive Maintenance.</td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      html += '<tr class="hover:bg-white/80 transition">';
      html += '<td class="p-3 font-mono font-bold text-teal-700 whitespace-nowrap">' + escapeHtml(item.idPM) + '</td>';
      html += '<td class="p-3"><div class="font-semibold text-slate-800">' + escapeHtml(item.bank) + '</div><div class="text-[11px] text-slate-500 font-mono">' + escapeHtml(item.serialNumber) + ' (' + escapeHtml(item.idMesin) + ')</div></td>';
      html += '<td class="p-3 text-slate-600 max-w-xs truncate">' + escapeHtml(item.lokasi) + '</td>';
      html += '<td class="p-3 whitespace-nowrap font-mono text-slate-700">' + escapeHtml(item.periode) + '</td>';
      html += '<td class="p-3 whitespace-nowrap font-mono text-slate-600">' + escapeHtml(item.tanggalRencana) + '</td>';
      html += '<td class="p-3 whitespace-nowrap font-mono text-slate-800 font-semibold">' + escapeHtml(item.tanggalRealisasi) + '</td>';
      html += '<td class="p-3 whitespace-nowrap"><span class="px-2 py-0.5 rounded-lg bg-slate-100 border border-slate-200 text-slate-700">' + escapeHtml(item.engineer) + '</span></td>';
      html += '<td class="p-3 whitespace-nowrap"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200">' + escapeHtml(item.status) + '</span></td>';
      html += '<td class="p-3 max-w-xs text-[11px] text-slate-500 truncate">' + escapeHtml(item.catatan || '-') + '</td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function filterPMTableClientSide() {
    var s = (document.getElementById('filter-pm-search').value || '').toLowerCase().trim();
    var st = (document.getElementById('filter-pm-status').value || 'ALL').trim();

    var filtered = currentPMList.filter(function(item) {
      if (st !== 'ALL' && item.status.toLowerCase() !== st.toLowerCase()) return false;
      if (s !== '') {
        return (
          item.idPM.toLowerCase().indexOf(s) !== -1 ||
          item.bank.toLowerCase().indexOf(s) !== -1 ||
          item.serialNumber.toLowerCase().indexOf(s) !== -1 ||
          item.idMesin.toLowerCase().indexOf(s) !== -1 ||
          item.lokasi.toLowerCase().indexOf(s) !== -1 ||
          item.engineer.toLowerCase().indexOf(s) !== -1
        );
      }
      return true;
    });

    renderPMTable(filtered);
  }

      html += '<div class="flex justify-between"><span>Tiket Selesai:</span><span class="font-bold text-emerald-600">' + (eng.totalSolving || 0) + ' Tiket</span></div>';

  function renderKPIScorecards() {
    var container = document.getElementById('kpi-scorecard-container');
    if (!container) return;

    var kpis = [
      { title: 'Ticket Dispatch Speed (Role Monitoring)', target: 'Maks. 15 Menit', actual: '8.4 Menit', score: '98.8%' },
      { title: 'FSE MTTR (Mean Time to Repair)', target: 'Maks. 4.0 Jam', actual: '2.6 Jam', score: '96.5%' },
      { title: 'ATM First Visit Resolution Rate', target: 'Min. 90.0%', actual: '94.2%', score: '104.6%' }
    ];

    var html = '';
    for (var i = 0; i < kpis.length; i++) {
      var k = kpis[i];
      html += '<div class="soft-card-panel p-4 flex items-center justify-between">';
      html += '<div><h4 class="font-semibold text-sm text-slate-800">' + escapeHtml(k.title) + '</h4><p class="text-slate-500 text-xs">Target: ' + escapeHtml(k.target) + ' | Aktual: <span class="font-mono font-bold text-slate-800">' + escapeHtml(k.actual) + '</span></p></div>';
      html += '<div class="text-right font-mono font-bold text-teal-700 text-lg">' + escapeHtml(k.score) + '</div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  function showToast(title, message, type) {
    var toast = document.getElementById('toast-notification');
    var icon = document.getElementById('toast-icon');
    var tTitle = document.getElementById('toast-title');
    var tMsg = document.getElementById('toast-message');

    if (!toast) return;

    tTitle.innerText = title;
    tMsg.innerText = message;

    if (type === 'error') {
      icon.innerHTML = '<i class="fa-solid fa-circle-exclamation text-rose-500"></i>';
      toast.style.borderColor = 'rgba(244, 63, 94, 0.4)';
    } else {
      icon.innerHTML = '<i class="fa-solid fa-circle-check text-teal-600"></i>';
      toast.style.borderColor = 'rgba(20, 184, 166, 0.4)';
    }

    toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
    setTimeout(function() {
      toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
    }, 4000);
  }

  function escapeHtml(string) {
    if (!string) return '';
    return String(string)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
