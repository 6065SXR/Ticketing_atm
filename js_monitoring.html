<!-- ========================================================
     JS MONITORING: Antrean Tiket NOC Horizontal, Paginasi, Filter,
     Submenu Pemilah Tipe Tiket (Semua, CM, PM, UAT), Tombol X Clear Search,
     Dashboard Metrics, Master FSE Horizontal,
     Fitur Alihkan Penugasan Tiket (Re-Assign FSE),
     Manajemen Akun Karyawan Universal (FSE, Monitoring, Super Admin),
     Database Mesin dengan Dropdown Interaktif FSE Pengelola & Status,
     SLA Achievement Berkeadilan (Tri-Party Stopwatch, Vendor OLA Capping 120m,
     Geographic Zoning, Repeat Problem Watchlist, & Leaderboard Reporting FSE).
     ======================================================== -->
<script>
  var currentTicketTypeFilter = 'ALL';
  var cachedSLAResultData = null;
  var searchSLAAuditDebounceTimer = null;
  var activeSLAMetricType = 'overall';

  var cachedFSEReportingData = null;
  var activeDrillDownFSE = null;

  /* State Manajemen User & Re-Assign Tiket */
  var currentUserTab = 'fse';
  var cachedUsersList = [];
  var activeReassignTicket = null;

  function openCreateTicketModal() {
    var modal = document.getElementById('modal-create-ticket');
    modal.classList.remove('hidden');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            document.getElementById('input-ticket-id').value = res.ticketId;
            document.getElementById('input-ticket-date').value = res.dateString;
            document.getElementById('input-ticket-time').value = res.timeString;
          }
        })
        .generateNewTicketNumber();
    }
  }

  function closeCreateTicketModal() {
    document.getElementById('modal-create-ticket').classList.add('hidden');
    document.getElementById('form-new-ticket').reset();
  }

  function handleFormSubmit(event) {
    event.preventDefault();

    var payload = {
      idTiket: String(document.getElementById('input-ticket-id').value).trim(),
      bank: String(document.getElementById('input-bank').value).trim(),
      serialNumber: String(document.getElementById('input-serial-number').value).trim(),
      idMesin: String(document.getElementById('input-machine-id').value).trim(),
      tanggalTiket: String(document.getElementById('input-ticket-date').value).trim(),
      jamTiket: String(document.getElementById('input-ticket-time').value).trim(),
      tipeTiket: String(document.getElementById('input-ticket-type').value).trim(),
      namaEngineer: String(document.getElementById('input-engineer').value).trim(),
      problem: String(document.getElementById('input-problem').value).trim(),
      note: String(document.getElementById('input-note').value).trim(),
      statusTiket: 'Assign',
      dispatcher: currentUser ? currentUser.name : 'Monitoring Officer',
      noteDispatcher: String(document.getElementById('input-note').value).trim()
    };

    currentTicketsList.unshift(payload);
    renderTicketsTable(currentTicketsList);
    closeCreateTicketModal();
    showToast('Tiket Diterbitkan', 'Tiket ' + payload.idTiket + ' tersimpan dengan status Assign.', 'success');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          fetchTickets(1);
          loadDashboardMetrics();
        })
        .createTicket(payload);
    }
  }

  /* Submenu Pemilah Tipe Tiket: Semua, CM, PM, UAT */
  function setTicketTypeFilter(type) {
    currentTicketTypeFilter = type || 'ALL';

    var pills = document.querySelectorAll('.ticket-type-pill');
    for (var i = 0; i < pills.length; i++) {
      pills[i].className = 'ticket-type-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-800 transition flex items-center gap-1.5';
    }

    var activePillId = 'tab-ticket-type-all';
    var labelText = 'Semua Tiket';

    if (type === 'CM') {
      activePillId = 'tab-ticket-type-cm';
      labelText = 'Corrective Maintenance (CM)';
    } else if (type === 'PM') {
      activePillId = 'tab-ticket-type-pm';
      labelText = 'Preventive Maintenance (PM)';
    } else if (type === 'UAT') {
      activePillId = 'tab-ticket-type-uat';
      labelText = 'UAT / Project / Aktivasi';
    }

    var activeBtn = document.getElementById(activePillId);
    if (activeBtn) {
      activeBtn.className = 'ticket-type-pill active px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 text-slate-800 bg-white shadow-sm border border-slate-200/60';
    }

    var labelEl = document.getElementById('label-active-ticket-type');
    if (labelEl) labelEl.innerText = labelText;

    fetchTickets(1);
  }

  function handleTicketSearchInput() {
    var searchEl = document.getElementById('filter-search');
    var clearBtn = document.getElementById('btn-clear-ticket-search');
    var query = searchEl ? String(searchEl.value || '').trim() : '';

    if (clearBtn) {
      if (query !== '') clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
    }

    debounceSearch();
  }

  function clearTicketSearch() {
    var searchEl = document.getElementById('filter-search');
    var clearBtn = document.getElementById('btn-clear-ticket-search');
    if (searchEl) searchEl.value = '';
    if (clearBtn) clearBtn.classList.add('hidden');
    fetchTickets(1);
  }

  function fetchTickets(page) {
    currentPage = page || 1;
    var searchEl = document.getElementById('filter-search');
    var statusEl = document.getElementById('filter-status');
    var bankEl = document.getElementById('filter-bank');

    var searchVal = searchEl ? String(searchEl.value || '').trim() : '';
    var statusVal = statusEl ? String(statusEl.value || 'ALL').trim() : 'ALL';
    var bankVal = bankEl ? String(bankEl.value || 'ALL').trim() : 'ALL';

    var tbody = document.getElementById('tickets-table-body');
    if (tbody && (!currentTicketsList || currentTicketsList.length === 0)) {
      tbody.innerHTML = '<tr><td colspan="11" class="text-center py-6 text-slate-400 font-mono text-xs"><i class="fa-solid fa-spinner fa-spin text-teal-600 mr-2 text-base"></i>Mengambil antrean tiket...</td></tr>';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            currentTicketsList = res.tickets || [];
            currentPage = res.page || 1;
            totalPages = res.totalPages || 1;
            totalItems = res.totalItems || 0;
            renderTicketsTable(currentTicketsList);
            updatePaginationControls();
          }
        })
        .getTicketsPaginated(currentPage, pageSize, searchVal, statusVal, bankVal);
    }
  }

  function debounceSearch() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(function() { fetchTickets(1); }, 350);
  }

  function changePage(direction) {
    var target = currentPage + direction;
    if (target >= 1 && target <= totalPages) fetchTickets(target);
  }

  function updatePaginationControls() {
    var pagStart = totalItems === 0 ? 0 : ((currentPage - 1) * pageSize) + 1;
    var pagEnd = Math.min(currentPage * pageSize, totalItems);

    var sEl = document.getElementById('pag-start');
    var eEl = document.getElementById('pag-end');
    var tEl = document.getElementById('pag-total');
    var cEl = document.getElementById('pag-current');

    if (sEl) sEl.innerText = pagStart;
    if (eEl) eEl.innerText = pagEnd;
    if (tEl) tEl.innerText = totalItems;
    if (cEl) cEl.innerText = currentPage + ' / ' + totalPages;

    var btnPrev = document.getElementById('btn-prev-page');
    var btnNext = document.getElementById('btn-next-page');
    if (btnPrev) btnPrev.disabled = (currentPage <= 1);
    if (btnNext) btnNext.disabled = (currentPage >= totalPages);
  }

  function getMonitoringTicketSLAWarning(t) {
    var rawTipe = String(t.tipeTiket || 'CM').toLowerCase();
    var isCM = (rawTipe.indexOf('cm') !== -1 || rawTipe.indexOf('corrective') !== -1);
    if (!isCM) return '';

    var stLower = String(t.statusTiket || '').toLowerCase();
    var nowMs = Date.now();
    var createStr = (t.tanggalTiket || '') + ' ' + (t.jamTiket || '');
    var createMs = new Date(createStr.replace(/-/g, '/')).getTime();
    var ageMins = !isNaN(createMs) ? Math.max(0, Math.floor((nowMs - createMs) / (60 * 1000))) : 0;

    if ((stLower === 'assign' || stLower === 'open' || stLower === 'baru') && ageMins > 5) {
      return '<div class="mt-1"><span class="px-2 py-0.5 rounded-md bg-rose-100 text-rose-800 font-bold text-[9px] border border-rose-300 animate-pulse inline-flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation text-rose-600"></i> Respon Lambat (' + ageMins + 'm)</span></div>';
    }

    if (stLower === 'handling' && t.waktuHandling) {
      var hMs = new Date(String(t.waktuHandling).replace(/-/g, '/')).getTime();
      if (!isNaN(hMs)) {
        var hMins = Math.floor((nowMs - hMs) / (60 * 1000));
        if (hMins > 120) {
          return '<div class="mt-1"><span class="px-2 py-0.5 rounded-md bg-rose-100 text-rose-800 font-bold text-[9px] border border-rose-300 inline-flex items-center gap-1"><i class="fa-solid fa-triangle-exclamation text-rose-600"></i> Handling Overdue (' + hMins + 'm)</span></div>';
        }
      }
    }

    if (stLower !== 'solving' && stLower !== 'solved' && stLower !== 'closed' && stLower !== 'cancel' && ageMins > 240) {
      return '<div class="mt-1"><span class="px-2 py-0.5 rounded-md bg-rose-600 text-white font-bold text-[9px] inline-flex items-center gap-1 animate-pulse"><i class="fa-solid fa-triangle-exclamation"></i> ⚠️ Melebihi batas SLA</span></div>';
    }

    var slaSt = String(t.statusSlaCm || '').toLowerCase();
    if (slaSt === 'performa tidak bagus' || slaSt === 'breached') {
      return '<div class="mt-1"><span class="px-2 py-0.5 rounded-md bg-rose-50 text-rose-700 font-bold text-[9px] border border-rose-200 inline-flex items-center gap-1"><i class="fa-solid fa-circle-exclamation text-rose-500"></i> Performa Tidak Bagus</span></div>';
    }

    return '';
  }

  function renderTicketsTable(tickets) {
    var tbody = document.getElementById('tickets-table-body');
    if (!tbody) return;

    var displayTickets = tickets || [];
    if (currentTicketTypeFilter !== 'ALL') {
      displayTickets = displayTickets.filter(function(t) {
        var rawT = String(t.tipeTiket || '').toLowerCase();
        if (currentTicketTypeFilter === 'CM') return (rawT.indexOf('cm') !== -1 || rawT.indexOf('corrective') !== -1);
        if (currentTicketTypeFilter === 'PM') return (rawT.indexOf('pm') !== -1 || rawT.indexOf('preventive') !== -1);
        if (currentTicketTypeFilter === 'UAT') return (rawT.indexOf('uat') !== -1 || rawT.indexOf('project') !== -1 || rawT.indexOf('activation') !== -1);
        return true;
      });
    }

    if (!displayTickets || displayTickets.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="text-center py-8 text-slate-400 font-mono text-xs"><i class="fa-solid fa-inbox text-2xl mb-2 block text-slate-300"></i>Tidak ada tiket yang cocok dengan filter.</td></tr>';
      return;
    }

    var isMonitoring = (currentUser && (currentUser.roleKey === 'monitoring' || currentUser.roleKey === 'admin'));
    var html = '';

    for (var i = 0; i < displayTickets.length; i++) {
      var t = displayTickets[i];
      var badge = getStatusBadgeHtml(t.statusTiket);
      var stLower = String(t.statusTiket || '').toLowerCase();
      var slaAlert = getMonitoringTicketSLAWarning(t);

      // Indikator Repeat Problem 7 Hari
      var repeatBadge = '';
      if (t.repeatCount7d && t.repeatCount7d >= 2) {
        var isHighRepeat = (t.repeatCount7d >= 3);
        var rColor = isHighRepeat ? 'bg-rose-100 text-rose-800 border-rose-300 animate-pulse' : 'bg-amber-100 text-amber-900 border-amber-300';
        repeatBadge = '<div class="mt-1"><span class="px-2 py-0.5 rounded-md font-bold text-[9px] border ' + rColor + ' inline-flex items-center gap-1" title="Unit ini mengalami gangguan ' + t.repeatCount7d + ' kali dalam 7 hari terakhir!"><i class="fa-solid fa-arrows-rotate ' + (isHighRepeat ? 'text-rose-600' : 'text-amber-600') + '"></i> Repeat ' + t.repeatCount7d + 'x (7 Hari)</span></div>';
      }

      var rawTipe = String(t.tipeTiket || 'CM').toLowerCase();
      var shorthandTipe = 'CM';
      var tipeBadgeClass = 'bg-rose-50 text-rose-700 border-rose-200';

      if (rawTipe.indexOf('preventive') !== -1 || rawTipe === 'pm') {
        shorthandTipe = 'PM';
        tipeBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
      } else if (rawTipe.indexOf('uat') !== -1 || rawTipe.indexOf('project') !== -1) {
        shorthandTipe = 'UAT/Project';
        tipeBadgeClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
      } else if (rawTipe.indexOf('activation') !== -1) {
        shorthandTipe = 'Activation';
        tipeBadgeClass = 'bg-sky-50 text-sky-700 border-sky-200';
      }

      var pureNote = t.noteDispatcher || t.note || '-';
      if (pureNote.indexOf(' | [') !== -1) {
        pureNote = pureNote.split(' | [')[0].trim();
      }

      var timeOpenDisplay = (t.tanggalTiket || '-') + ' ' + (t.jamTiket || '') + ' WIB';

      // Cek apakah tiket masih aktif (bisa dialihkan penugasannya)
      var canReassign = isMonitoring && (
        stLower !== 'closed' && 
        stLower !== 'cancel' && 
        stLower !== 'batal' && 
        stLower !== 'solved' && 
        stLower !== 'solving'
      );

      html += '<tr class="hover:bg-white/80 transition">';
      html += '<td class="p-3 font-mono font-bold text-teal-700 whitespace-nowrap">' + escapeHtml(t.idTiket) + '</td>';
      html += '<td class="p-3 font-semibold text-slate-800 whitespace-nowrap">' + escapeHtml(t.bank) + '</td>';
      html += '<td class="p-3 font-mono font-bold text-teal-800 whitespace-nowrap">' + escapeHtml(t.idMesin) + '</td>';
      html += '<td class="p-3 font-mono text-slate-600 whitespace-nowrap text-xs">' + escapeHtml(t.serialNumber) + '</td>';
      html += '<td class="p-3 font-mono text-slate-700 whitespace-nowrap text-xs">' + escapeHtml(timeOpenDisplay) + '</td>';
      html += '<td class="p-3 whitespace-nowrap"><span class="px-2 py-0.5 rounded-md font-bold text-[11px] border ' + tipeBadgeClass + '">' + shorthandTipe + '</span></td>';
      html += '<td class="p-3 whitespace-nowrap"><span class="px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-700 font-medium">' + escapeHtml(t.namaEngineer) + '</span></td>';
      html += '<td class="p-3 max-w-xs font-medium text-slate-800 truncate" title="' + escapeHtml(t.problem) + '">' + escapeHtml(t.problem) + '</td>';
      html += '<td class="p-3 max-w-xs text-slate-500 italic text-[11px] truncate" title="' + escapeHtml(pureNote) + '">' + escapeHtml(pureNote) + '</td>';
      html += '<td class="p-3 whitespace-nowrap">' + badge + slaAlert + repeatBadge + '</td>';
      html += '<td class="p-3 text-center whitespace-nowrap">';
      html += '<div class="flex items-center justify-center gap-1.5">';
      
      // Tombol 1: Riwayat Audit
      html += '<button onclick="openFSETimelineModal(\'' + escapeHtml(t.idTiket) + '\')" title="Lihat Riwayat" class="px-2.5 py-1 text-[11px] rounded-lg bg-teal-50 border border-teal-200 text-teal-700 hover:bg-teal-600 hover:text-white transition flex items-center gap-1 shadow-sm font-medium">';
      html += '<i class="fa-solid fa-clock-rotate-left text-[10px]"></i> Riwayat';
      html += '</button>';

      // Tombol 2: Alihkan FSE (Re-Assign) untuk Tiket Aktif
      if (canReassign) {
        html += '<button onclick="openReassignTicketModal(\'' + escapeHtml(t.idTiket) + '\')" title="Alihkan Penugasan Teknisi (FSE Izin/Sakit)" class="px-2.5 py-1 text-[11px] rounded-lg bg-amber-50 border border-amber-200 text-amber-800 hover:bg-amber-600 hover:text-white transition flex items-center gap-1 shadow-sm font-semibold">';
        html += '<i class="fa-solid fa-people-arrows text-[10px]"></i> Alihkan';
        html += '</button>';
      }

      // Tombol 3: Closed Permanen untuk Tiket Solved
      if (isMonitoring && (stLower === 'solved' || stLower === 'solving')) {
        html += '<button onclick="executeTicketAction(\'' + escapeHtml(t.idTiket) + '\', \'Closed\', { note: \'Tiket ditutup permanen oleh Monitoring\' })" title="Tutup Tiket Permanen (Pindah ke Kirim Dokumen FSE)" class="px-2.5 py-1 text-[11px] rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold transition flex items-center gap-1 shadow-sm">';
        html += '<i class="fa-solid fa-lock text-[10px]"></i> Closed';
        html += '</button>';
      }

      html += '</div>';
      html += '</td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;

    renderDashboardRecent(tickets);
  }

  /* ========================================================
     FITUR 1: LOGIKA ALIKAN PENUGASAN TIKET (RE-ASSIGN FSE)
     ======================================================== */
  function openReassignTicketModal(ticketId) {
    var ticket = (currentTicketsList || []).find(function(t) { return t.idTiket === ticketId; });
    if (!ticket) {
      showToast('Error', 'Data tiket tidak ditemukan.', 'error');
      return;
    }

    activeReassignTicket = ticket;

    var elId = document.getElementById('reassign-ticket-id');
    var elBank = document.getElementById('reassign-ticket-bank');
    var elSn = document.getElementById('reassign-ticket-sn');
    var elIdMesin = document.getElementById('reassign-ticket-idmesin');
    var elProblem = document.getElementById('reassign-ticket-problem');
    var elCurrentFse = document.getElementById('reassign-current-fse');
    var elReason = document.getElementById('reassign-reason');
    var selectNewFse = document.getElementById('reassign-new-fse');

    if (elId) elId.innerText = ticket.idTiket;
    if (elBank) elBank.innerText = ticket.bank || '-';
    if (elSn) elSn.innerText = ticket.serialNumber || '-';
    if (elIdMesin) elIdMesin.innerText = ticket.idMesin || '-';
    if (elProblem) elProblem.innerText = ticket.problem || '-';
    if (elCurrentFse) elCurrentFse.innerText = ticket.namaEngineer || 'Belum Ditugaskan';
    if (elReason) elReason.value = '';

    // Isi daftar FSE pengganti yang aktif dan bukan FSE saat ini
    var currentEngineer = String(ticket.namaEngineer || '').trim().toLowerCase();
    var fseOptions = '<option value="">-- Pilih Teknisi Pengganti --</option>';

    var engineers = (cachedDropdowns && cachedDropdowns.engineers && cachedDropdowns.engineers.length > 0)
      ? cachedDropdowns.engineers
      : currentFSEList;

    for (var i = 0; i < (engineers || []).length; i++) {
      var eng = engineers[i];
      var engName = String(eng.nama || eng).trim();
      var engWilayah = String(eng.wilayah || 'Jabodetabek').trim();
      
      // Lewati teknisi yang sedang memegang tiket ini saat ini
      if (engName.toLowerCase() === currentEngineer) continue;

      fseOptions += '<option value="' + escapeHtml(engName) + '">' + escapeHtml(engName) + ' (' + escapeHtml(engWilayah) + ')</option>';
    }

    if (selectNewFse) selectNewFse.innerHTML = fseOptions;

    var modal = document.getElementById('modal-reassign-ticket');
    if (modal) modal.classList.remove('hidden');
  }

  function closeReassignTicketModal() {
    var modal = document.getElementById('modal-reassign-ticket');
    if (modal) modal.classList.add('hidden');
    activeReassignTicket = null;
  }

  function submitReassignTicket(event) {
    if (event) event.preventDefault();
    if (!activeReassignTicket) return;

    var ticketId = activeReassignTicket.idTiket;
    var selectNewFse = document.getElementById('reassign-new-fse');
    var elReason = document.getElementById('reassign-reason');
    var btnSubmit = document.getElementById('btn-submit-reassign');

    var newEngineer = selectNewFse ? selectNewFse.value.trim() : '';
    var reason = elReason ? elReason.value.trim() : '';

    if (!newEngineer) {
      showToast('Peringatan', 'Silakan pilih teknisi pengganti terlebih dahulu.', 'error');
      return;
    }
    if (!reason) {
      showToast('Peringatan', 'Alasan pengalihan tugas wajib diisi.', 'error');
      return;
    }

    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengalihkan Tiket...';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fa-solid fa-people-arrows"></i> <span>Simpan &amp; Alihkan Tiket</span>';
          }
          closeReassignTicketModal();

          if (res && res.status === 'success') {
            showToast('Pengalihan Berhasil', res.message, 'success');
            fetchTickets(currentPage || 1);
            loadDashboardMetrics();
          } else {
            showToast('Gagal Pengalihan', res ? res.message : 'Error server', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fa-solid fa-people-arrows"></i> <span>Simpan &amp; Alihkan Tiket</span>';
          }
          showToast('Error Server', 'Kendala server: ' + err, 'error');
        })
        .reassignTicketFSE(ticketId, newEngineer, reason, currentUser);
    } else {
      setTimeout(function() {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="fa-solid fa-people-arrows"></i> <span>Simpan &amp; Alihkan Tiket</span>';
        }
        closeReassignTicketModal();
        showToast('Pengalihan Berhasil (Demo)', 'Tiket ' + ticketId + ' dialihkan ke ' + newEngineer, 'success');
        fetchTickets(1);
      }, 500);
    }
  }

  /* ========================================================
     FITUR 2: LOGIKA SUB-TAB KARYAWAN & REGISTRASI UNIVERSAL
     ======================================================== */
  function switchUserTab(tabName) {
    currentUserTab = tabName || 'fse';

    var btnFSE = document.getElementById('tab-user-fse');
    var btnStaff = document.getElementById('tab-user-staff');
    var contentFSE = document.getElementById('content-tab-fse');
    var contentStaff = document.getElementById('content-tab-staff');
    var labelTab = document.getElementById('label-active-user-tab');
    var btnCSV = document.getElementById('btn-fse-csv-import');

    if (currentUserTab === 'fse') {
      if (btnFSE) btnFSE.className = 'user-tab-pill active px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 text-slate-800 bg-white shadow-sm border border-slate-200/60';
      if (btnStaff) btnStaff.className = 'user-tab-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-800 transition flex items-center gap-1.5';
      if (contentFSE) contentFSE.classList.remove('hidden');
      if (contentStaff) contentStaff.classList.add('hidden');
      if (labelTab) labelTab.innerText = 'Daftar Teknisi Lapangan (FSE)';
      if (btnCSV) btnCSV.classList.remove('hidden');
      renderFSETable(currentFSEList);
    } else {
      if (btnStaff) btnStaff.className = 'user-tab-pill active px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 text-slate-800 bg-white shadow-sm border border-slate-200/60';
      if (btnFSE) btnFSE.className = 'user-tab-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-800 transition flex items-center gap-1.5';
      if (contentStaff) contentStaff.classList.remove('hidden');
      if (contentFSE) contentFSE.classList.add('hidden');
      if (labelTab) labelTab.innerText = 'Daftar Petugas Monitoring & Super Admin';
      if (btnCSV) btnCSV.classList.add('hidden');
      loadUsersData();
    }
  }

  function handleUserSearchInput() {
    var searchInput = document.getElementById('filter-fse-search');
    var clearBtn = document.getElementById('btn-clear-fse-search');
    var query = searchInput ? searchInput.value.toLowerCase().trim() : '';

    if (clearBtn) {
      if (query !== '') clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
    }

    if (currentUserTab === 'fse') {
      var filteredFSE = currentFSEList.filter(function(item) {
        if (!query) return true;
        return (
          item.userId.toLowerCase().indexOf(query) !== -1 ||
          item.nama.toLowerCase().indexOf(query) !== -1 ||
          item.wilayah.toLowerCase().indexOf(query) !== -1 ||
          item.noHp.toLowerCase().indexOf(query) !== -1
        );
      });
      renderFSETable(filteredFSE);
    } else {
      var filteredStaff = cachedUsersList.filter(function(item) {
        if (!query) return true;
        return (
          item.userId.toLowerCase().indexOf(query) !== -1 ||
          item.nama.toLowerCase().indexOf(query) !== -1 ||
          item.role.toLowerCase().indexOf(query) !== -1 ||
          item.wilayah.toLowerCase().indexOf(query) !== -1 ||
          item.noHp.toLowerCase().indexOf(query) !== -1
        );
      });
      renderStaffTable(filteredStaff);
    }
  }

  function clearUserSearch() {
    var searchInput = document.getElementById('filter-fse-search');
    var clearBtn = document.getElementById('btn-clear-fse-search');
    if (searchInput) searchInput.value = '';
    if (clearBtn) clearBtn.classList.add('hidden');

  function openCreateUserModal() {
    var form = document.getElementById('form-new-user');
    if (form) form.reset();

    var roleSelect = document.getElementById('input-user-role');
    if (roleSelect) {
      // Set default sesuai tab yang aktif saat ini
      roleSelect.value = (currentUserTab === 'staff') ? 'Monitoring' : 'FSE';
      handleUserRoleChange(roleSelect.value);
    }

    var modal = document.getElementById('modal-create-user');
    if (modal) modal.classList.remove('hidden');

  function closeCreateUserModal() {
    var modal = document.getElementById('modal-create-user');
    if (modal) modal.classList.add('hidden');

  function handleUserRoleChange(roleValue) {
    var containerFseFields = document.getElementById('container-user-fse-fields');
    var inputMesin = document.getElementById('input-user-mesin');
    if (!containerFseFields) return;

    if (roleValue === 'FSE') {
      containerFseFields.classList.remove('hidden');
      if (inputMesin) inputMesin.required = true;
    } else {
      containerFseFields.classList.add('hidden');
      if (inputMesin) {
        inputMesin.required = false;
        inputMesin.value = '0';
      }
    }
  }

  function handleCreateUserSubmit(event) {
    if (event) event.preventDefault();

    var role = document.getElementById('input-user-role').value;
    var nama = document.getElementById('input-user-nama').value.trim();
    var noHp = document.getElementById('input-user-hp').value.trim();
    var password = document.getElementById('input-user-password').value.trim();
    var wilayah = document.getElementById('input-user-wilayah').value.trim();
    var kelolaanMesin = parseInt(document.getElementById('input-user-mesin').value, 10) || 0;

    var payload = {
      role: role,
      nama: nama,
      noHp: noHp,
      password: password,
      wilayah: wilayah,
      kelolaanMesin: kelolaanMesin
    };

    var btnSubmit = document.getElementById('btn-submit-user');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan Akun...';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fa-solid fa-save"></i> <span>Simpan Akun</span>';
          }
          closeCreateUserModal();

          if (res && res.status === 'success') {
            showToast('Akun Didaftarkan', res.message, 'success');
            loadSectionAuxiliaryData('FSE');
            loadUsersData();
            loadDropdowns();
          } else {
            showToast('Gagal Daftar', res ? res.message : 'Error server', 'error');
          }
        })
        .withFailureHandler(function(err) {
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="fa-solid fa-save"></i> <span>Simpan Akun</span>';
          }
          showToast('Error Server', 'Kendala server: ' + err, 'error');
        })
        .registerUser(payload, currentUser);
    } else {
      setTimeout(function() {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="fa-solid fa-save"></i> <span>Simpan Akun</span>';
        }
        closeCreateUserModal();
        showToast('Akun Didaftarkan (Demo)', 'Akun ' + role + ' atas nama ' + nama + ' siap digunakan.', 'success');
        loadUsersData();
      }, 500);
    }
  }

  function loadDashboardMetrics() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            var d = res.data;
            document.getElementById('stat-total').innerText = d.totalTickets;
            document.getElementById('stat-open').innerText = d.openTickets;
            document.getElementById('stat-handling').innerText = d.handlingTickets;
            document.getElementById('stat-solved').innerText = d.solvingTickets;

            updateDistributionBars(d.totalTickets, d.solvingTickets, d.handlingTickets, d.openTickets);
          }
        })
        .getSectionData('DashboardMetrics');
    }
  }

  function updateDistributionBars(total, solved, handling, open) {
    if (total <= 0) total = 1;
    var pSolved = Math.round((solved / total) * 100);
    var pHandling = Math.round((handling / total) * 100);
    var pOpen = Math.round((open / total) * 100);

    var distS = document.getElementById('dist-solving');
    var barS = document.getElementById('dist-bar-solving');
    var distH = document.getElementById('dist-handling');
    var barH = document.getElementById('dist-bar-handling');
    var distO = document.getElementById('dist-open');
    var barO = document.getElementById('dist-bar-open');

    if (distS) distS.innerText = pSolved + '%';
    if (barS) barS.style.width = pSolved + '%';
    if (distH) distH.innerText = pHandling + '%';
    if (barH) barH.style.width = pHandling + '%';
    if (distO) distO.innerText = pOpen + '%';
    if (barO) barO.style.width = pOpen + '%';
  }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            showToast('FSE Diperbarui', res.message, 'success');
            loadDropdowns();

  function downloadCSVContent(csvRows, filename) {
    var csvContent = '\uFEFF';
    for (var r = 0; r < csvRows.length; r++) {
      var row = csvRows[r];
      var escapedRow = [];
      for (var c = 0; c < row.length; c++) {
        var val = String(row[c] === undefined || row[c] === null ? '' : row[c]);
        if (val.search(/("|,|\n)/g) >= 0) {
          val = '"' + val.replace(/"/g, '""') + '"';
        }
        escapedRow.push(val);
      }
      csvContent += escapedRow.join(',') + '\r\n';
    }

    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    var url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', filename);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    showToast('Download Berhasil', 'Berkas ' + filename + ' berhasil diunduh.', 'success');
  }

  function handleCSVImportSubmit(event) {
    event.preventDefault();
    var targetType = document.getElementById('csv-target-type').value;
    var fileInput = document.getElementById('input-csv-file');

    if (!fileInput.files || !fileInput.files[0]) {
      showToast('Peringatan', 'Silakan pilih berkas CSV terlebih dahulu.', 'error');
      return;
    }

    var btn = document.getElementById('btn-submit-csv');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses CSV...'; }

    var reader = new FileReader();
    reader.onload = function(e) {
      var csvText = e.target.result;
      var rows = parseCSVText(csvText);

      if (rows.length > 0) {
        var firstRowJoined = rows[0].join(' ').toLowerCase();
        if (firstRowJoined.indexOf('id') !== -1 || firstRowJoined.indexOf('bank') !== -1 || firstRowJoined.indexOf('nama') !== -1) {
          rows = rows.slice(1);
        }
      }

      if (rows.length === 0) {
        if (btn) { btn.disabled = false; btn.innerHTML = 'Mulai Impor'; }
        showToast('CSV Kosong', 'Berkas CSV tidak memuat baris data yang valid.', 'error');
        return;
      }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            closeCSVImportModal();
            if (btn) { btn.disabled = false; btn.innerHTML = 'Mulai Impor'; }

            if (res && res.status === 'success') {
              showToast('Impor Berhasil', res.message, 'success');
              if (targetType === 'Machines') loadSectionAuxiliaryData('DatabaseMesin');
              else if (targetType === 'FSE') { loadSectionAuxiliaryData('FSE'); loadUsersData(); }
              else if (targetType === 'Customers') loadSectionAuxiliaryData('DatabaseCustomer');
            } else {
              showToast('Gagal Impor', res ? res.message : 'Error backend', 'error');
            }
          })
          .withFailureHandler(function(err) {
            if (btn) { btn.disabled = false; btn.innerHTML = 'Mulai Impor'; }
            showToast('Error Server', 'Kendala server: ' + err, 'error');
          })
          .importCSVData(targetType, rows, currentUser);
      }
    };
    reader.readAsText(fileInput.files[0]);
  }

  function parseCSVText(text) {
    var lines = text.split(/\r\n|\n/);
    var result = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var cols = line.split(',');
      for (var c = 0; c < cols.length; c++) {
        cols[c] = cols[c].replace(/^["']|["']$/g, '').trim();
      }
      result.push(cols);
    }
    return result;
  }

  function renderChronicMachinesTable(chronicList) {
    var tbody = document.getElementById('chronic-machines-table-body');

    var criticalOrWarningCount = 0;
    for (var c = 0; c < (chronicList || []).length; c++) {
      if (chronicList[c].totalIncidents >= 2) criticalOrWarningCount++;
    }

    if (badgeCount) {
      badgeCount.innerText = criticalOrWarningCount + ' Unit Repeat Problem Terdeteksi';
      if (criticalOrWarningCount > 0) {
        badgeCount.className = 'px-2.5 py-1 rounded-xl bg-rose-100 text-rose-800 border border-rose-300 text-xs font-bold font-mono animate-pulse';

      return;
    }

    var html = '';
    for (var i = 0; i < chronicList.length; i++) {

      } else if (isWarning) {
        statusBadge = '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900 border border-amber-300"><i class="fa-solid fa-circle-exclamation mr-1 text-amber-600"></i>Warning (2x) - Repeat Problem</span>';

      html += '<td class="p-3 font-mono font-bold text-slate-800 whitespace-nowrap">' + escapeHtml(ch.serialNumber) + '</td>';

      html += '<td class="p-3 text-slate-700 max-w-xs truncate" title="' + escapeHtml(ch.dominantProblem) + '">' + escapeHtml(ch.dominantProblem) + '</td>';
      html += '<td class="p-3 text-center whitespace-nowrap">' + statusBadge + '</td>';

    tbody.innerHTML = html;

  function filterSLAAuditTickets() {
    if (!cachedSLAResultData || !cachedSLAResultData.auditTickets) return;

    var searchEl = document.getElementById('filter-sla-audit-search');
    var statusEl = document.getElementById('filter-sla-audit-status');

    var q = searchEl ? searchEl.value.toLowerCase().trim() : '';
    var st = statusEl ? statusEl.value : 'ALL';

    var filtered = cachedSLAResultData.auditTickets.filter(function(item) {
      if (st === 'VENDOR_BREACH') {
        if (!item.isVendorBreach) return false;
      } else if (st !== 'ALL' && item.slaStatus !== st) {
        return false;
      }

      if (q) {
        var match = (
          item.idTiket.toLowerCase().indexOf(q) !== -1 ||
          item.serialNumber.toLowerCase().indexOf(q) !== -1 ||
          item.idMesin.toLowerCase().indexOf(q) !== -1 ||
          item.namaEngineer.toLowerCase().indexOf(q) !== -1 ||
          item.bank.toLowerCase().indexOf(q) !== -1 ||
          item.problem.toLowerCase().indexOf(q) !== -1 ||
          item.zonaSla.toLowerCase().indexOf(q) !== -1
        );
        if (!match) return false;
      }
      return true;
    });

    renderSLAAuditTable(filtered);
  }

      csvRows.push(['HASIL EVALUASI', s.totalSavedHours + ' Jam (' + (s.totalSavedMinutes || 0) + ' Menit Sah Dipotong dari Penalti Perusahaan)']);
      csvRows.push([]);
      csvRows.push(['NO', 'ID TIKET', 'BANK', 'SERIAL NUMBER', 'ID MESIN', 'ENGINEER', 'KATEGORI CLOCK-STOP', 'ALASAN / CATATAN', 'WAKTU MULAI', 'WAKTU SELESAI', 'DURASI (MENIT)', 'DURASI (JAM/MENIT)', 'STATUS KOMPENSASI']);

      for (var p = 0; p < pauses.length; p++) {
        var ps = pauses[p];
        csvRows.push([
          p + 1,
          ps.idTiket,
          ps.bank,
          ps.serialNumber,
          ps.idMesin,
          ps.namaEngineer,
          ps.category,
          ps.reason,
          ps.startTime,
          ps.endTime,
          ps.durationMins,
          ps.durationDisplay,
          ps.statusKompensasi
        ]);
      }
    }

    downloadCSVContent(csvRows, filename);
  }
