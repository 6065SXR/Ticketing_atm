<!-- SECTION: DATABASE MESIN -->
<section id="sec-DatabaseMesin" class="view-section space-y-4 hidden">
  <div class="soft-card-panel p-5">

        <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">

      <div class="flex items-center gap-2.5 w-full sm:w-auto">

          </tr>

        <tbody id="machines-table-body" class="divide-y divide-slate-100">

            <td colspan="7" class="text-center py-6 text-slate-400 text-xs font-mono">
